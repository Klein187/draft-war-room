<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dynasty Draft War Room — 12-team Dynasty PPR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root{
  --ink:#0A101C; --panel:#121C2F; --panel-2:#18243B; --line:#24334E; --line-soft:#1A263D;
  --text:#E8EEF9; --text-2:#A6B6D3; --text-3:#7386A8;
  --cyan:#55C8F5; --cyan-dim:#123246; --mint:#46D39A; --amber:#F0A93C; --coral:#FF6E7E; --gold:#F2C75C;
  --qb:#F07BA6; --rb:#5FD9A8; --wr:#5BB8F0; --te:#F0A055; --k:#AFA6F2; --dst:#C77E63;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --tap:44px;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); background:var(--ink); color:var(--text);
  max-width:600px; margin:0 auto; padding:0 var(--sp-3) 0;
  font-size:15px; line-height:1.5;
}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---------- sticky command bar: the signature ---------- */
.topbar{position:sticky; top:0; z-index:40; background:var(--ink); padding:var(--sp-3) 0 var(--sp-2);
  box-shadow:0 8px 16px -12px rgba(0,0,0,.9)}
.chyron{border:1px solid var(--line); background:var(--panel); border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-4); position:relative; overflow:hidden}
.chyron::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--text-3)}
.chyron.mine{background:linear-gradient(180deg,#10301F,#0D2418); border-color:#2C6B4E}
.chyron.mine::before{background:var(--mint)}
.chyron-main{display:flex; align-items:baseline; gap:var(--sp-3); flex-wrap:wrap}
.pick-tag{font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.06em;
  background:var(--panel-2); color:var(--text-2); border:1px solid var(--line);
  padding:3px 8px; border-radius:6px; font-variant-numeric:tabular-nums}
.chyron.mine .pick-tag{background:#17402B; color:#8CEFC0; border-color:#2C6B4E}
.chyron-big{font-family:var(--cond); font-weight:700; font-size:clamp(20px,5.4vw,26px);
  letter-spacing:.01em; line-height:1.1; text-transform:uppercase}
.chyron.mine .chyron-big{color:#A8F5CE}
.chyron-sub{font-size:12.5px; color:var(--text-2); margin-top:4px; font-variant-numeric:tabular-nums}
.chyron-sub b{color:var(--mint); font-weight:600}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:var(--sp-1); margin-top:var(--sp-2); background:var(--panel);
  border:1px solid var(--line-soft); border-radius:var(--r-md); padding:3px}
.tab-btn{flex:1; min-height:38px; background:transparent; color:var(--text-2); border:none;
  border-radius:9px; padding:8px 4px; font-size:13px; font-weight:600; font-family:var(--sans);
  cursor:pointer; transition:background .15s,color .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{background:var(--cyan-dim); color:var(--cyan); box-shadow:inset 0 0 0 1px #1E5B7D}
.tab-btn.undo{flex:0 0 58px; color:var(--amber)}
.tab-btn.undo:disabled{opacity:.3; cursor:default}

/* ---------- market depth ladder ---------- */
.market-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-2); margin:var(--sp-4) 0 var(--sp-2)}
.market-cell{background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-sm);
  padding:var(--sp-2) var(--sp-2) 9px; text-align:center}
.market-pos{font-family:var(--cond); font-weight:700; font-size:13px; letter-spacing:.08em}
.market-num{font-family:var(--mono); font-weight:700; font-size:19px; line-height:1.15; margin-top:2px;
  font-variant-numeric:tabular-nums}
.market-lbl{font-family:var(--cond); font-size:10px; font-weight:700; letter-spacing:.1em; margin-top:1px}
.depth{height:3px; border-radius:2px; background:var(--line); margin-top:7px; overflow:hidden}
.depth i{display:block; height:100%; border-radius:2px}
.market-caption{font-size:11.5px; color:var(--text-3); line-height:1.45; margin:0 0 var(--sp-4); padding:0 2px}
.market-caption b{font-weight:600}
.market-note{font-size:12.5px; color:#FFD9A0; background:#2A1E0C; border:1px solid #4A3616;
  border-left:3px solid var(--amber); border-radius:var(--r-sm); padding:10px var(--sp-3);
  margin-bottom:var(--sp-2); line-height:1.45}

/* ---------- primary actions ---------- */
.sl-row{display:flex; gap:var(--sp-2); margin-bottom:var(--sp-4)}
.sl-connect,.mock-start-btn{min-height:var(--tap); border-radius:var(--r-md); font-family:var(--sans);
  font-size:14px; font-weight:600; cursor:pointer; border:1px solid; padding:12px 10px}
.sl-connect{flex:1; background:var(--cyan-dim); color:var(--cyan); border-color:#1E5B7D}
.sl-connect.live{background:#10301F; color:#8CEFC0; border-color:#2C6B4E}
.mock-start-btn{width:100%; background:var(--panel-2); color:var(--text); border-color:var(--line); margin-bottom:var(--sp-4)}
.sl-half{flex:1; margin-bottom:0}

/* ---------- suggestions: the working surface ---------- */
.suggest-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
  overflow:hidden; margin-bottom:var(--sp-4)}
.suggest-head{font-family:var(--cond); font-weight:700; font-size:13px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--text-2); padding:11px var(--sp-3) 9px;
  border-bottom:1px solid var(--line-soft); background:var(--panel-2)}
.suggest-row{display:flex; align-items:center; gap:var(--sp-3); width:100%; min-height:var(--tap);
  padding:10px var(--sp-3); background:transparent; border:none; border-top:1px solid var(--line-soft);
  text-align:left; cursor:pointer; font-family:var(--sans); color:var(--text)}
.suggest-row:first-of-type{border-top:none}
.suggest-row:hover{background:var(--panel-2)}
.sug-num{width:16px; text-align:right; font-family:var(--mono); font-size:12px; font-weight:600;
  color:var(--text-3); flex-shrink:0; font-variant-numeric:tabular-nums}
.suggest-name{font-size:15px; font-weight:600; line-height:1.3}
.star{color:var(--gold)}
.reason{font-size:12px; color:var(--text-2); margin-top:3px; line-height:1.4}
.hint{font-family:var(--cond); font-size:10px; font-weight:700; letter-spacing:.1em;
  color:var(--text-3); flex-shrink:0}

/* ---------- badges + chips ---------- */
.pos-badge{min-width:38px; text-align:center; font-family:var(--cond); font-weight:700; font-size:12px;
  letter-spacing:.06em; color:#0A101C; border-radius:6px; padding:5px 5px; flex-shrink:0}
.age-chip{font-family:var(--mono); font-size:10.5px; font-weight:600; border-radius:4px; padding:1px 5px;
  font-variant-numeric:tabular-nums; white-space:nowrap}
.age-young{background:#123528; color:#7FE9BB}
.age-mid{background:var(--panel-2); color:var(--text-2)}
.age-old{background:#3A1620; color:#FFA3AF}
.ppg-chip{font-family:var(--mono); font-size:10.5px; font-weight:700; color:#8CEFC0; background:#10301F;
  border-radius:4px; padding:1px 5px}
.edge-up{color:var(--mint); font-size:11.5px; font-weight:600}
.edge-dn{color:var(--amber); font-size:11.5px; font-weight:600}

/* ---------- search + filters ---------- */
.search{width:100%; min-height:var(--tap); background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r-md); color:var(--text); padding:11px var(--sp-3); font-size:16px;
  font-family:var(--sans); outline:none; margin-bottom:var(--sp-2)}
.search::placeholder{color:var(--text-3)}
.search:focus{border-color:var(--cyan)}
.chip-row{display:flex; gap:6px; margin-bottom:var(--sp-3); flex-wrap:wrap}
.chip{min-height:34px; border:1px solid var(--line); background:var(--panel); color:var(--text-2);
  border-radius:999px; padding:6px 14px; font-family:var(--cond); font-size:12px; font-weight:700;
  letter-spacing:.08em; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cyan-dim); color:var(--cyan); border-color:#1E5B7D}

/* ---------- player list ---------- */
.player-row{display:flex; align-items:center; gap:var(--sp-3); width:100%; min-height:var(--tap);
  padding:9px 6px; background:transparent; border:none; border-bottom:1px solid var(--line-soft);
  text-align:left; cursor:pointer; font-family:var(--sans); color:var(--text)}
.player-row:hover{background:var(--panel)}
.rank-num{width:30px; text-align:right; font-family:var(--mono); font-size:12px; font-weight:600;
  color:var(--text-3); flex-shrink:0; font-variant-numeric:tabular-nums}
.p-name{font-size:15px; font-weight:600}
.team-tag{font-family:var(--mono); font-size:11.5px; color:var(--text-3); font-weight:500}

/* ---------- roster + board ---------- */
.section-label{font-family:var(--cond); font-weight:700; font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--text-3); margin:var(--sp-5) 0 var(--sp-2);
  padding-bottom:6px; border-bottom:1px solid var(--line-soft)}
.roster-row{display:flex; align-items:center; gap:var(--sp-3); padding:9px 4px; min-height:42px;
  border-bottom:1px solid var(--line-soft)}
.board-row{display:flex; align-items:center; gap:var(--sp-3); width:100%; padding:8px 6px;
  border-radius:var(--r-sm); background:transparent; border:none; text-align:left;
  font-family:var(--sans); color:var(--text); cursor:pointer; min-height:40px}
.board-row.mine{background:#10301F; box-shadow:inset 0 0 0 1px #2C6B4E}
.board-pick{width:42px; font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--text-3);
  flex-shrink:0; font-variant-numeric:tabular-nums}
.avg-age{font-size:13px; color:var(--text-2); text-align:center; margin:var(--sp-3) 0 0;
  padding:10px; background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-sm)}
.empty{color:var(--text-3); text-align:center; padding:var(--sp-5) var(--sp-3); font-size:14px}

/* ---------- grade report ---------- */
.grade-hero{text-align:center; padding:var(--sp-5) 0 var(--sp-3)}
.grade-letter{font-family:var(--cond); font-weight:700; font-size:76px; line-height:.9; letter-spacing:-.02em}
.grade-sub{font-family:var(--mono); font-size:13px; color:var(--text-2); margin-top:6px}
.grade-card{background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-md);
  padding:var(--sp-3); margin-bottom:var(--sp-2)}
.grade-round{font-family:var(--cond); font-weight:700; font-size:12px; letter-spacing:.1em;
  color:var(--cyan); text-transform:uppercase}
.grade-pick{font-size:15px; font-weight:600; margin:4px 0}
.grade-verdict{font-family:var(--cond); font-size:11px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; padding:3px 8px; border-radius:5px; display:inline-block; margin-top:5px}
.v-steal{background:#123528; color:#7FE9BB}
.v-fine{background:var(--panel-2); color:var(--text-2)}
.v-reach{background:#3A1620; color:#FFA3AF}
.grade-tip{font-size:13px; color:var(--text-2); line-height:1.5; margin-top:6px}
.grade-alt{font-size:12px; color:var(--text-3); margin-top:6px; line-height:1.45}
.summary-row{display:flex; justify-content:space-between; align-items:center; gap:var(--sp-3);
  font-size:13.5px; padding:9px 0; border-top:1px solid var(--line-soft); color:var(--text-2)}
.summary-row:first-child{border-top:none}
.summary-row b{font-family:var(--mono); font-weight:600; color:var(--text); font-variant-numeric:tabular-nums}

/* ---------- mock banner ---------- */
.mock-banner{display:flex; align-items:center; gap:var(--sp-3); background:#1E1733;
  border:1px solid #3D2F63; border-left:3px solid #8E6FE0; border-radius:var(--r-sm);
  padding:10px var(--sp-3); margin-bottom:var(--sp-3)}
.mock-banner-txt{flex:1; font-size:12.5px; font-weight:600; color:#C9B6F5; line-height:1.4}
.mock-exit{min-height:36px; background:#2A2047; color:#C9B6F5; border:1px solid #4A3A75;
  border-radius:var(--r-sm); padding:7px 13px; font-size:12px; font-weight:600; cursor:pointer;
  font-family:var(--sans)}

/* ---------- buttons ---------- */
.danger-btn,.ghost-btn,.close-btn,.draft-btn,.lookup-btn,.sl-btn,.sl-league{
  font-family:var(--sans); cursor:pointer; border-radius:var(--r-md); font-weight:600}
.draft-btn{flex:1; min-height:var(--tap); background:var(--mint); color:#04140D; border:none;
  font-size:15px; padding:13px}
.draft-btn:disabled{background:var(--panel-2); color:var(--text-3); cursor:default}
.close-btn{min-height:var(--tap); background:var(--panel-2); color:var(--text-2);
  border:1px solid var(--line); padding:13px 16px; font-size:14px}
.danger-btn{min-height:var(--tap); background:#3A1620; color:#FFA3AF; border:1px solid #6B2F3C;
  padding:12px 18px; margin-right:var(--sp-2); font-size:14px}
.ghost-btn{min-height:var(--tap); background:transparent; color:var(--text-2);
  border:1px solid var(--line); padding:12px 18px; font-size:14px}
.lookup-row{display:flex; gap:var(--sp-2)}
.lookup-btn{flex:1; min-height:var(--tap); background:var(--panel-2); color:var(--cyan);
  border:1px solid #1E5B7D; padding:12px 10px; font-size:13px; text-align:center}
.modal-actions{display:flex; gap:var(--sp-2); margin-top:var(--sp-4)}

/* ---------- player card internals ---------- */
.modal-name{font-family:var(--cond); font-weight:700; font-size:25px; line-height:1.1}
.modal-sub{font-family:var(--mono); font-size:12px; color:var(--text-3); margin-top:3px}
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--sp-2); margin:var(--sp-4) 0}
.stat-box{background:var(--panel-2); border:1px solid var(--line-soft); border-radius:var(--r-sm);
  padding:10px 6px; text-align:center}
.stat-val{font-family:var(--mono); font-weight:700; font-size:20px; font-variant-numeric:tabular-nums}
.stat-lbl{font-family:var(--cond); font-size:10px; color:var(--text-3); font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; margin-top:3px}
.note-row{font-size:13px; color:var(--text-2); line-height:1.55; padding:9px 0;
  border-top:1px solid var(--line-soft)}
.scout-head{font-family:var(--cond); font-weight:700; font-size:12px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--text-3); margin:var(--sp-4) 0 var(--sp-2)}

/* ---------- floating windows ---------- */
.win{position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:0 24px 60px rgba(0,0,0,.66); display:flex; flex-direction:column; overflow:hidden}
.win-bar{display:flex; align-items:center; gap:var(--sp-2); background:var(--panel-2);
  border-bottom:1px solid var(--line); padding:10px var(--sp-3); cursor:grab;
  touch-action:none; user-select:none; flex-shrink:0}
.win-bar:active{cursor:grabbing}
.win-title{flex:1; font-family:var(--cond); font-weight:700; font-size:15px; letter-spacing:.03em;
  color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase}
.win-x{background:var(--panel); color:var(--text-2); border:1px solid var(--line); border-radius:7px;
  width:32px; height:32px; font-size:13px; cursor:pointer; flex-shrink:0}
.win-body{flex:1; overflow-y:auto; padding:var(--sp-4); -webkit-overflow-scrolling:touch}
.win-grip{position:absolute; right:0; bottom:0; width:28px; height:28px; cursor:nwse-resize;
  touch-action:none; background:linear-gradient(135deg,transparent 50%,var(--line) 50%,var(--line) 62%,
  transparent 62%,transparent 74%,var(--line) 74%,var(--line) 86%,transparent 86%)}
.win-note{display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; font-size:11.5px;
  color:var(--text-2); background:var(--panel-2); border:1px solid var(--line-soft);
  border-radius:var(--r-sm); padding:9px 10px; margin-bottom:var(--sp-2); line-height:1.4}
.win-open{background:var(--cyan-dim); color:var(--cyan); border:1px solid #1E5B7D; border-radius:7px;
  padding:8px 12px; font-size:12px; font-weight:600; text-decoration:none; white-space:nowrap; margin-left:auto}
.win-frame-wrap{position:relative; height:calc(100% - 52px); min-height:180px; border-radius:var(--r-sm);
  overflow:hidden; background:var(--ink)}
.win-frame{width:100%; height:100%; border:0; background:#fff}

/* ---------- sleeper panel ---------- */
.sl-live{font-family:var(--cond); font-weight:700; font-size:19px; color:#8CEFC0; margin-bottom:4px}
.sl-meta{font-size:12.5px; color:var(--text-2); line-height:1.5; margin:var(--sp-2) 0}
.sl-warn{font-size:12.5px; color:#FFD9A0; background:#2A1E0C; border:1px solid #4A3616;
  border-left:3px solid var(--amber); border-radius:var(--r-sm); padding:10px; margin:var(--sp-2) 0; line-height:1.45}
.sl-btn{width:100%; min-height:var(--tap); background:var(--cyan-dim); color:var(--cyan);
  border:1px solid #1E5B7D; padding:12px; font-size:14px; margin-top:var(--sp-2)}
.sl-btn.sl-stop{background:#3A1620; color:#FFA3AF; border-color:#6B2F3C}
.sl-league{display:block; width:100%; min-height:var(--tap); text-align:left; background:var(--panel-2);
  color:var(--text); border:1px solid var(--line); padding:12px; font-size:14px; margin-bottom:6px}
.sl-sub{font-family:var(--mono); font-size:11px; color:var(--text-3); font-weight:500}

.flex1{flex:1; min-width:0}
.footer{text-align:center; color:var(--text-3); font-family:var(--mono); font-size:10.5px;
  padding:var(--sp-5) 0 var(--sp-5); line-height:1.6; border-top:1px solid var(--line-soft); margin-top:var(--sp-5)}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0}


/* ---------- layout: single column on phones, three columns on desktop ---------- */
.grid{display:block}
.col-head{display:none}
.col-body{min-height:0}

@media (min-width:1000px){
  body{max-width:1500px; height:100vh; display:flex; flex-direction:column;
       padding:0 var(--sp-4); overflow:hidden}
  .topbar{position:static; padding-top:var(--sp-4)}
  .grid{display:grid; grid-template-columns:352px minmax(0,1fr) 380px; gap:var(--sp-4);
        flex:1; min-height:0; padding-bottom:var(--sp-4)}
  .col{display:flex; flex-direction:column; min-height:0; min-width:0;
       background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r-lg); overflow:hidden}
  .col-head{display:block; font-family:var(--cond); font-weight:700; font-size:12px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--text-3);
    padding:12px var(--sp-4) 10px; border-bottom:1px solid var(--line-soft);
    background:var(--panel-2); flex-shrink:0}
  .col-body{flex:1; overflow-y:auto; overscroll-behavior:contain;
    padding:var(--sp-4); scrollbar-width:thin; scrollbar-color:var(--line) transparent}
  .col-body::-webkit-scrollbar{width:10px}
  .col-body::-webkit-scrollbar-track{background:transparent}
  .col-body::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;
    border:3px solid var(--panel)}
  .col-body::-webkit-scrollbar-thumb:hover{background:#31456B}

  /* panels sit flush inside their column */
  .col-left .market-strip{margin-top:0}
  .col-left .suggest-card{margin-bottom:0; border:none; background:transparent}
  .col-left .suggest-head{display:none}
  .col-left .suggest-row{border-radius:var(--r-sm); border-top:1px solid var(--line-soft)}
  .col-right .search{position:sticky; top:0; z-index:2}
  .col-right .chip-row{position:sticky; top:56px; z-index:2; background:var(--panel);
    padding:6px 0 8px; margin-bottom:0}
  .footer{display:none}
  .section-label:first-child{margin-top:0}
  .grade-hero{padding-top:var(--sp-3)}
}

@media (min-width:1000px) and (max-width:1200px){
  .grid{grid-template-columns:320px minmax(0,1fr) 330px; gap:var(--sp-3)}
}

/* ---------- live pick feed ---------- */
.feed-row{display:flex; align-items:center; gap:var(--sp-3); padding:8px 6px; min-height:40px;
  border-bottom:1px solid var(--line-soft); border-radius:var(--r-sm)}
.feed-row.mine{background:#10301F; box-shadow:inset 0 0 0 1px #2C6B4E; border-bottom-color:transparent}
.feed-name{font-size:14px; font-weight:600}


/* ---------- your roster composition ---------- */
.mine-head{display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-2);
  font-family:var(--cond); font-weight:700; font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--text-3); margin-bottom:var(--sp-2)}
.mine-total{font-family:var(--mono); font-size:11px; letter-spacing:0; text-transform:none; color:var(--text-3)}
.mine-strip{display:grid; grid-template-columns:repeat(6,1fr); gap:5px}
.mine-cell{background:var(--panel-2); border:1px solid var(--line-soft); border-radius:var(--r-sm);
  padding:7px 2px 6px; text-align:center}
.mine-pos{font-family:var(--cond); font-weight:700; font-size:11px; letter-spacing:.06em}
.mine-num{font-family:var(--mono); font-weight:700; font-size:17px; line-height:1.2;
  font-variant-numeric:tabular-nums; color:var(--text)}
.mine-state{font-family:var(--cond); font-size:9.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; margin-top:1px}
.mine-state.need{color:var(--amber)}
.mine-state.set{color:var(--text-3)}
.mine-state.none{color:var(--text-3)}
.mine-foot{font-size:11.5px; color:var(--text-3); line-height:1.45; margin:var(--sp-2) 0 var(--sp-4); padding:0 2px}

/* ---------- roster rows ---------- */
.roster-name{font-size:14px; font-weight:600; line-height:1.3}
.slot-tag{font-family:var(--cond); font-size:10px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--text-3); background:var(--panel-2);
  border:1px solid var(--line-soft); border-radius:5px; padding:3px 7px; flex-shrink:0}
.slot-empty{color:var(--text-3); font-size:14px}
.roster-row.empty-slot{opacity:.72}

/* ---- deploy shim: provides window.storage (artifact API) on top of localStorage ---- */
(function(){
  if (window.storage && window.storage.get) return;
  var NS = 'warroom:';
  function ok(v){ return Promise.resolve(v); }
  window.storage = {
    get: function(k){
      try { var v = localStorage.getItem(NS+k);
            return ok(v === null ? null : {key:k, value:v, shared:false}); }
      catch(e){ return Promise.reject(e); }
    },
    set: function(k,v){
      try { localStorage.setItem(NS+k, v); return ok({key:k, value:v, shared:false}); }
      catch(e){ return Promise.reject(e); }
    },
    delete: function(k){
      try { localStorage.removeItem(NS+k); return ok({key:k, deleted:true}); }
      catch(e){ return Promise.reject(e); }
    },
    list: function(prefix){
      try { var out=[]; for (var i=0;i<localStorage.length;i++){ var key=localStorage.key(i);
              if (key.indexOf(NS)===0){ var bare=key.slice(NS.length);
                if (!prefix || bare.indexOf(prefix)===0) out.push(bare); } }
            return ok({keys:out, prefix:prefix||'', shared:false}); }
      catch(e){ return Promise.reject(e); }
    }
  };
})();

/* ---- No API key, no cost ----

/* --- name matching between the board and fetched projection rows --- */
function normName(s){
  return String(s).toLowerCase()
    .replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g,'')
    .replace(/d\/st|dst|defense/g,'')
    .replace(/[^a-z ]/g,'')
    .replace(/\s+/g,' ').trim();
}
var NAME_INDEX = null;
function nameIndex(){
  if (NAME_INDEX) return NAME_INDEX;
  NAME_INDEX = {};
  PLAYERS.forEach(function(p){
    NAME_INDEX[normName(p.name) + '|' + p.pos] = p.rank;
    var parts = normName(p.name).split(' ');
    if (parts.length > 1) NAME_INDEX[parts[0][0] + ' ' + parts[parts.length-1] + '|' + p.pos] = p.rank;
  });
  return NAME_INDEX;
}
function matchPlayer(name, pos){
  var idx = nameIndex();
  var n = normName(name);
  if (idx[n + '|' + pos] != null) return idx[n + '|' + pos];
  var parts = n.split(' ');
  if (parts.length > 1) {
    var abbr = parts[0][0] + ' ' + parts[parts.length-1] + '|' + pos;
    if (idx[abbr] != null) return idx[abbr];
  }
  /* last-name fallback, only when unambiguous at that position */
  var last = parts[parts.length-1];
  if (last) {
    var hits = PLAYERS.filter(function(p){
      return p.pos === pos && normName(p.name).split(' ').slice(-1)[0] === last;
    });
    if (hits.length === 1) return hits[0].rank;
  }
  return null;
}

function fetchProjections(){
  if (projStatus === 'loading') return;
  projStatus = 'loading';
  var done = 0, matched = 0, missed = [];
  render();

  function runBatch(i){
    if (i >= PROJ_BATCHES.length) {
      projStatus = matched > 40 ? 'ready' : 'error';
      projProgress = matched + ' players matched' + (missed.length ? ', ' + missed.length + ' unmatched' : '');
      if (hasStorage() && matched > 40) {
        window.storage.set('proj-v1', JSON.stringify({ proj: PROJ, when: Date.now(), matched: matched })).catch(function(){});
      }
      render();
      return;
    }
    var b = PROJ_BATCHES[i];
    projProgress = 'Fetching ' + b.label + '\u2026 (' + (i+1) + '/' + PROJ_BATCHES.length + ')';
    render();
    var prompt = 'Search the web for 2026 NFL fantasy football season projections. ' +
      'Return the projected 2026 season for ' + (b.skip ? 'the ' + b.label : 'the top ' + b.n + ' ' + b.label) + '. ' +
      'Scoring is FULL PPR with these non-standard rules: 6 points per passing TD, 0.04 pts per passing yard, ' +
      '0.1 pts per rushing/receiving yard, 6 pts rushing/receiving TD, -2 fumble lost, -1 interception. ' +
      'Respond with ONLY a raw JSON array, no markdown fences, no commentary. Each element: ' +
      '{"name":"Full Name","team":"ABV","pts":<projected total season fantasy points as a number>,' +
      '"ppg":<projected fantasy points per game as a number>,"games":<projected games played>}. ' +
      'Use real published projections where available. Order by projected points, highest first.';
    fetch(API_ENDPOINT(), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000,
        messages:[{role:'user',content:prompt}],
        tools:[{type:'web_search_20250305', name:'web_search'}] })
    }).then(function(r){ return r.json(); }).then(function(data){
      var text = (data.content||[]).filter(function(x){return x.type==='text';}).map(function(x){return x.text;}).join('\n');
      var clean = text.replace(/```json|```/g,'').trim();
      var s = clean.indexOf('['), e = clean.lastIndexOf(']');
      if (s >= 0 && e > s) {
        var rows = JSON.parse(clean.substring(s, e+1));
        rows.forEach(function(row){
          var rank = matchPlayer(row.name, b.pos);
          if (rank != null && row.ppg != null) {
            if (!PROJ[rank]) matched++;
            PROJ[rank] = { ppg: Number(row.ppg), pts: Number(row.pts) || null, games: Number(row.games) || null };
          } else if (rank == null) { missed.push(row.name); }
        });
      }
    }).catch(function(err){ console.error('proj batch failed', b.label, err); })
      .then(function(){ done++; runBatch(i+1); });
  }
  runBatch(0);
}

/* projected value vs dynasty rank: positive = produces better than his dynasty price */
function projEdge(p){
  if (!PROJ[p.rank]) return null;
  var mine = PROJ[p.rank].ppg;
  var peers = PLAYERS.filter(function(x){ return x.pos === p.pos && PROJ[x.rank]; })
                     .sort(function(a,b){ return PROJ[b.rank].ppg - PROJ[a.rank].ppg; });
  var prodRank = peers.findIndex(function(x){ return x.rank === p.rank; }) + 1;
  var dynPosRank = PLAYERS.filter(function(x){ return x.pos === p.pos && x.rank <= p.rank; }).length;
  return { ppg: mine, prodRank: prodRank, dynPosRank: dynPosRank, delta: dynPosRank - prodRank };
}

/* roster construction rules for a 1QB, 17-round dynasty roster */
var POS_CAP = { QB:3, RB:12, WR:15, TE:5, K:1, DST:1 };   /* 37 capacity vs 29 picks */
var POS_TARGET = { QB:2, RB:6, WR:7, TE:2, K:1, DST:1 };

function remainingPicksFor(team, fromOverall){
  var n = 0;
  for (var p = fromOverall; p <= TOTAL_PICKS; p++) if (teamOnClock(p) === team) n++;
  return n;
}
/* positions that MUST still be filled (mandatory starting slots with no options later) */
function mandatoryLeft(counts){
  return (counts.K === 0 ? 1 : 0) + (counts.DST === 0 ? 1 : 0) +
         (counts.QB === 0 ? 1 : 0) + (counts.TE === 0 ? 1 : 0);
}

/* ===== MARKET STATE: league-wide supply & demand ===== */
function marketState(){
  var avail = available();
  var m = {};
  var flexDemand = 0;
  var totalDemand = 0;
  var posTotals = { QB:0, RB:0, WR:0, TE:0 };
  var teamCounts = [];
  for (var t = 1; t <= NUM_TEAMS; t++) {
    var c = needCounts(teamPlayers(t));
    teamCounts.push(c);
    var used = Math.max(0, c.RB - STARTERS.RB) + Math.max(0, c.WR - STARTERS.WR) + Math.max(0, c.TE - STARTERS.TE);
    flexDemand += Math.max(0, STARTERS.FLEX - used);
    posTotals.QB += c.QB; posTotals.RB += c.RB; posTotals.WR += c.WR; posTotals.TE += c.TE;
  }
  var recent = picks.slice(-12).map(function(r){ return BY_RANK[r].pos; });
  var horizon = 36; /* roughly the next 3 rounds of board */
  /* how many picks happen before I select again? that's the window that matters */
  var cur = picks.length + 1;
  var nextMine = teamOnClock(cur) === MY_SLOT ? myNextPick(cur + 1) : myNextPick(cur);
  var gap = nextMine ? nextMine - cur : 0;

  ['QB','RB','WR','TE'].forEach(function(pos){
    var demand = 0;
    teamCounts.forEach(function(c){ demand += Math.max(0, STARTERS[pos] - c[pos]); });
    /* RB/WR/TE also compete for the 2 flex slots on every roster */
    if (pos === 'RB' || pos === 'WR') demand += flexDemand * 0.4;
    else if (pos === 'TE') demand += flexDemand * 0.2;

    var atPos = avail.filter(function(p){ return p.pos === pos; });
    var supply = avail.slice(0, horizon).filter(function(p){ return p.pos === pos; }).length;
    var best = atPos[0];
    var tierLeft = best ? atPos.filter(function(p){ return p.tier === best.tier; }).length : 0;

    m[pos] = {
      demand: demand,
      supply: supply,
      tierLeft: tierLeft,
      topTier: best ? best.tier : null,
      bestName: best ? best.name : null,
      bestRank: best ? best.rank : null,
      bestIdx: avail.findIndex(function(p){ return p.pos === pos; }),
      ratio: supply > 0 ? demand / supply : 99,
      run: recent.filter(function(x){ return x === pos; }).length,
      recentTotal: recent.length,
      leagueAvg: posTotals[pos] / NUM_TEAMS
    };
    totalDemand += demand;
  });

  /* pressure = will the current quality tier at this position survive until I pick again?
     expTaken = share of the next `gap` picks likely spent on this position.
     >= 1 means the tier is probably gone before your next turn. */
  ['QB','RB','WR','TE'].forEach(function(pos){
    var st = m[pos];
    st.gap = gap;
    st.expTaken = totalDemand > 0 ? gap * (st.demand / totalDemand) : 0;
    st.pressure = st.tierLeft > 0 ? st.expTaken / st.tierLeft : 99;
  });
  return m;
}

function teamPlayers(t){

function aiPickRank(overall){
  var team = teamOnClock(overall);
  var counts = needCounts(teamPlayers(team));
  var round = Math.ceil(overall / NUM_TEAMS);
  var avail = available();
  if (!avail.length) return null;
  var flexUsed = Math.max(0, counts.RB - STARTERS.RB) + Math.max(0, counts.WR - STARTERS.WR) + Math.max(0, counts.TE - STARTERS.TE);
  var flexOpen = Math.max(0, STARTERS.FLEX - flexUsed);
  var myLeft = remainingPicksFor(team, overall);
  var mustFill = mandatoryLeft(counts);
  var forced = myLeft <= mustFill; /* out of runway: only fill mandatory holes */

  var pool = avail.filter(function(p){
    if (counts[p.pos] >= POS_CAP[p.pos]) return false;
    if (forced) {
      if (p.pos === 'K') return counts.K === 0;
      if (p.pos === 'DST') return counts.DST === 0;
      if (p.pos === 'QB') return counts.QB === 0;
      if (p.pos === 'TE') return counts.TE === 0;
      return false;
    }
    if ((p.pos === 'K' || p.pos === 'DST') && round < 26) return false;
    return true;
  });
  if (!pool.length) pool = avail.filter(function(p){ return counts[p.pos] < POS_CAP[p.pos]; });
  if (!pool.length) pool = avail.filter(function(p){ return p.pos !== 'K' && p.pos !== 'DST'; });
  if (!pool.length) pool = avail;

  /* K/DST sit at the very bottom of the board, so a plain top-N slice never sees them.
     Pull the best eligible one in explicitly once their window opens. */
  var cand = pool.slice(0, 45);
  ['K','DST'].forEach(function(pos){
    if (counts[pos] > 0) return;
    if (round < 26 && !forced) return;
    for (var i = 0; i < pool.length; i++) {
      if (pool[i].pos === pos) { if (cand.indexOf(pool[i]) < 0) cand.push(pool[i]); break; }
    }
  });
  var scored = cand.map(function(p){
    var s = 320 - p.rank;
    if (p.pos === 'QB') { if (counts.QB === 0) s += (round >= 4 ? 20 : 4); else s -= 60; }
    else if (p.pos === 'TE') { if (counts.TE === 0) s += 10; else s -= 50; }
    else if (p.pos === 'RB' || p.pos === 'WR') {
      var open = STARTERS[p.pos] - counts[p.pos];
      if (open > 0) s += 14; else if (flexOpen > 0) s += 7; else s += 1;
      if (round >= 8 && counts[p.pos] < POS_TARGET[p.pos]) s += 10; /* build depth */
    } else { s += 200; } /* K/DST only reach here when appropriate */
    if (p.pos !== 'DST') {
      if (p.age <= 23) s += 4;
      else if (p.pos === 'RB' && p.age >= 28) s -= 8;
      else if (p.age >= 31) s -= 6;
    }
    s += Math.random() * 14; /* human unpredictability */
    return { p: p, s: s };
  });
  scored.sort(function(a,b){ return b.s - a.s; });
  var poolSize = Math.min(3, scored.length);
  return scored[Math.floor(Math.random() * poolSize)].p.rank;
}

/* ===== GRADING ===== */
function bestFitFor(pool, roster, round){
  /* highest-ranked available player who fills an open starter/flex slot */
  var counts = needCounts(roster);
  var flexUsed = Math.max(0, counts.RB - STARTERS.RB) + Math.max(0, counts.WR - STARTERS.WR) + Math.max(0, counts.TE - STARTERS.TE);
  var flexOpen = Math.max(0, STARTERS.FLEX - flexUsed);
  var capped = pool.filter(function(p){ return counts[p.pos] < POS_CAP[p.pos]; });
  var fits = capped.filter(function(p){
    if (p.pos === 'K' || p.pos === 'DST') return round >= 26 && counts[p.pos] === 0;
    if (p.pos === 'QB') return counts.QB === 0;
    if (p.pos === 'TE') return counts.TE === 0 || flexOpen > 0;
    return (STARTERS[p.pos] - counts[p.pos]) > 0 || flexOpen > 0;
  });
  /* starters full: any non-K/DST player under the cap is legitimate depth */
  if (!fits.length) fits = capped.filter(function(p){ return p.pos !== 'K' && p.pos !== 'DST'; });
  if (!fits.length) fits = capped;
  return fits.length ? fits[0] : pool[0];
}

function gradeMock(){
  var rounds = [];
  var totalCost = 0;
  for (var i = 0; i < picks.length; i++) {
    var overall = i + 1;
    if (teamOnClock(overall) !== MY_SLOT) continue;
    var p = BY_RANK[picks[i]];
    var round = Math.ceil(overall / NUM_TEAMS);
    /* rebuild board + my roster as they were at that moment */
    var takenBefore = {};
    var rosterThen = [];
    for (var j = 0; j < i; j++) {
      takenBefore[picks[j]] = 1;
      if (teamOnClock(j + 1) === MY_SLOT) rosterThen.push(BY_RANK[picks[j]]);
    }
    var poolThen = PLAYERS.filter(function(x){ return !takenBefore[x.rank]; });
    var bestFit = bestFitFor(poolThen, rosterThen, round);
    var bestOverall = poolThen[0];

    /* what did the tool itself recommend at that exact moment? rewind state and ask */
    var savedPicks = picks;
    picks = savedPicks.slice(0, i);
    var sugThen = [];
    try { sugThen = suggest(10); } catch (e) { sugThen = []; }
    picks = savedPicks;
    var sugIdx = -1;
    for (var k = 0; k < sugThen.length; k++) if (sugThen[k].p.rank === p.rank) { sugIdx = k; break; }
    var sugTop = sugThen.length ? sugThen[0].p : null;

    /* cost = dynasty value given up vs the best need-fitting option. 0 or less = optimal */
    var rawCost = p.rank - bestFit.rank;
    var slip = overall - p.rank; /* how far he fell past his rank */
    var isKD = (p.pos === 'K' || p.pos === 'DST');
    if (isKD && round >= 26) rawCost = 0;
    /* a pick the engine ranked highly was defensible on scarcity/depth grounds,
       even when a higher-ranked name was technically on the board.
       Credit scales with how strongly it was recommended. */
    var cost = rawCost;
    if (sugIdx === 0) cost = Math.min(rawCost, 2);
    else if (sugIdx >= 1 && sugIdx <= 2) cost = Math.min(rawCost, 10);
    else if (sugIdx >= 3) cost = Math.min(rawCost, 12);
    totalCost += Math.max(0, cost);

    var verdict, cls, tip;
    if (cost <= 2) { verdict = 'Optimal'; cls = 'v-steal'; }
    else if (cost <= 14) { verdict = 'Fair'; cls = 'v-fine'; }
    else { verdict = 'Reach'; cls = 'v-reach'; }

    if (isKD) {
      tip = round >= 26
        ? 'Correct timing \u2014 ' + (p.pos === 'K' ? 'kickers' : 'defenses') + ' belong in the final rounds and get replaced yearly.'
        : 'Too early. This roster spot should have been a young stash; ' + (p.pos==='K'?'kickers':'defenses') + ' are free every season. ' + bestFit.name + ' (' + bestFit.pos + ' #' + bestFit.rank + ') was the pick here.';
    } else if (sugIdx === 0) {
      tip = 'Took the board\u0027s top recommendation. ' + (rawCost > 14
        ? 'Higher-ranked names were available, but positional scarcity and your roster holes made him the right call.'
        : 'Clean, correct pick.');
    } else if (sugIdx > 0 && sugIdx <= 2) {
      tip = 'A recommended option (#' + (sugIdx + 1) + ' on the board). Defensible \u2014 though ' + sugTop.name + ' (' + sugTop.pos + ' #' + sugTop.rank + ') was rated slightly ahead of him for your build.';
    } else if (cost > 14) {
      tip = 'You gave up ' + cost + ' spots of dynasty value. ' + bestFit.name + ' (' + bestFit.pos + ' #' + bestFit.rank + ') was the highest-rated player who still fit an open slot' +
        (bestFit.pos === p.pos ? ' at the same position.' : ' \u2014 taking him and circling back to ' + p.pos + ' later is usually the cleaner path.');
      if (sugTop) tip += ' The board had ' + sugTop.name + ' (' + sugTop.pos + ') as its top suggestion here.';
    } else if (cost <= 2 && slip >= 15) {
      tip = 'Best available for your build, and he fell ' + slip + ' picks past his dynasty rank. Ideal pick.';
    } else if (cost <= 2) {
      tip = 'Best available player who fit your roster. Exactly right.';
    } else {
      tip = 'Reasonable \u2014 only ' + cost + ' spots below the top option. ' + bestFit.name + ' (' + bestFit.pos + ' #' + bestFit.rank + ') was the highest-rated fit if you wanted the pure-value play.';
    }
    if (bestOverall.rank < bestFit.rank && !isKD && sugIdx < 0) {
      tip += ' (' + bestOverall.name + ' was the overall #1 on the board but didn\u0027t fit an open slot.)';
    }
    if (p.pos === 'RB' && p.age >= 28) tip += ' Age ' + p.age + ' RB \u2014 win-now only, minimal resale.';
    else if (p.rookie) tip += ' Rookie \u2014 highest variance, highest ceiling.';

    rounds.push({
      round: round, label: pickLabel(overall), player: p, cost: cost, slip: slip,
      verdict: verdict, cls: cls, tip: tip,
      alts: poolThen.filter(function(x){ return x.rank !== p.rank; }).slice(0, 3)
    });
  }

  var mine = myPlayers();
  var counts = needCounts(mine);
  var slots = slotRoster(mine);
  var emptyStarters = slots.slice(0, STARTER_COUNT).filter(function(s){ return !s.player; }).length;
  var skill = mine.filter(function(x){ return x.pos !== 'K' && x.pos !== 'DST'; });
  var avgAge = skill.length ? skill.reduce(function(a,x){ return a + x.age; }, 0) / skill.length : 0;
  var elites = mine.filter(function(x){ return x.rank <= 24; }).length;
  var avgCost = rounds.length ? totalCost / rounds.length : 0;
  var earlyKDst = rounds.filter(function(r){ return (r.player.pos==='K'||r.player.pos==='DST') && r.round < 26; }).length;
  var reaches = rounds.filter(function(r){ return r.cost > 14; }).length;

  var score = 90;
  score -= Math.min(30, avgCost * 1.2);   /* decision quality: main driver */
  score -= emptyStarters * 7;
  score -= reaches * 1.5;                 /* consistency */
  score += avgAge && avgAge <= 25 ? 3 : (avgAge >= 28 ? -5 : 0);
  if (counts.RB < 3) score -= 4;
  if (counts.WR < 4) score -= 4;
  if (counts.QB === 0) score -= 6;
  if (counts.TE === 0) score -= 4;
  score -= earlyKDst * 5;
  score = Math.max(35, Math.min(99, score));

  var letter = score >= 95 ? 'A+' : score >= 90 ? 'A' : score >= 87 ? 'A-' :
               score >= 83 ? 'B+' : score >= 80 ? 'B' : score >= 77 ? 'B-' :
               score >= 73 ? 'C+' : score >= 70 ? 'C' : score >= 67 ? 'C-' :
               score >= 60 ? 'D' : 'F';
  var color = score >= 87 ? '#6ee7b4' : score >= 77 ? '#5bc0f8' : score >= 67 ? '#f8a94e' : '#f4778a';

  function plural(n, word){ return n + ' ' + word + (n === 1 ? '' : 's'); }
  var bigNotes = [];
  if (emptyStarters > 0) bigNotes.push('You finished with ' + plural(emptyStarters, 'empty starting slot') + ' \u2014 fill every starter before stashing depth.');
  if (counts.RB < 3) bigNotes.push('Only ' + plural(counts.RB, 'RB') + '. With 2 RB slots plus flex, 4+ is the target for injury cover.');
  if (counts.WR < 4) bigNotes.push('Only ' + plural(counts.WR, 'WR') + '. You start 3 plus flex in full PPR \u2014 5+ is the target.');
  if (counts.QB === 0) bigNotes.push('No QB. In a 6pt pass TD league that is a huge weekly hole.');
  if (counts.TE === 0) bigNotes.push('No TE \u2014 you have a mandatory starting slot with nobody in it.');
  if (avgAge >= 28) bigNotes.push('Average skill age ' + avgAge.toFixed(1) + ' \u2014 a win-now roster that needs a rebuild in 2\u20133 years.');
  else if (avgAge && avgAge <= 24.5) bigNotes.push('Average skill age ' + avgAge.toFixed(1) + ' \u2014 outstanding dynasty foundation, though possibly light on immediate production.');
  if (elites === 0) bigNotes.push('No top-24 dynasty assets. Contending rosters usually need at least one true cornerstone.');
  if (earlyKDst) bigNotes.push('You spent an early pick on a K or DEF \u2014 never do this in dynasty.');
  if (reaches >= 4) bigNotes.push('You reached on ' + reaches + ' picks. Trust the board \u2014 your guy often lasts another round from slot 10.');
  else if (avgCost <= 4) bigNotes.push('Disciplined drafting \u2014 you took the best available fit nearly every round.');
  if (!bigNotes.length) bigNotes.push('Balanced, well-constructed roster with no glaring holes.');

  return {
    letter: letter, score: Math.round(score), color: color, rounds: rounds,
    avgCost: avgCost, avgAge: avgAge, counts: counts, elites: elites,
    emptyStarters: emptyStarters, reaches: reaches, notes: bigNotes
  };
}


function scoutHTML(d){

  }
  return row('2025', d.stats2025) + row('2024', d.stats2024) + row('Role', d.role) +

    '<div style="text-align:right;margin-top:4px;"><button class="scout-btn" style="width:auto;padding:6px 12px;font-size:12px;" onclick="fetchScout(currentModalRank, true)">Refresh</button></div>';
}

function fetchScout(rank, force){
  var p = BY_RANK[rank];
  if (!p) return;
  var box = document.getElementById('scout-box');
  if (!box) return;
  box.innerHTML = '<div class="scout-loading">Scouting ' + esc(p.name) + '\u2026 (searching the web, ~10s)</div>';
  var subject = p.pos === 'DST'
    ? p.name + ' (' + p.team + ' team defense, fantasy football)'
    : p.name + ' (' + p.pos + ', ' + p.team + ', NFL)';
  var prompt = 'Search the web for current info on ' + subject + ' for a July 2026 dynasty fantasy football draft. ' +
    'Respond with ONLY a raw JSON object, no markdown fences, no preamble, with these string fields (each 25 words max, use "N/A" if unknown): ' +
    '"stats2025" (their actual 2025 NFL season stat line with real numbers, e.g. yards/TDs/receptions, plus fantasy finish if found), ' +
    '"stats2024" (brief 2024 season stat line), ' +
    '"role" (current 2026 role/depth chart situation), ' +
    '"health" (current injury status), ' +
    '"news" (most recent notable headline), ' +
    '"dynasty" (blunt 1-2 sentence dynasty verdict for a 1QB full-PPR league).' +
    (p.rookie ? ' This is a 2026 rookie: use their final college season for stats2025 and label it as college.' : '');
  fetch(API_ENDPOINT(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }],
      tools: [{ type: 'web_search_20250305', name: 'web_search' }]
    })
  }).then(function(res){ return res.json(); }).then(function(data){
    var text = (data.content || [])
      .filter(function(b){ return b.type === 'text'; })
      .map(function(b){ return b.text; })
      .join('\n');
    var clean = text.replace(/```json|```/g, '').trim();
    var start = clean.indexOf('{');
    var end = clean.lastIndexOf('}');
    if (start < 0 || end < 0) throw new Error('no json');
    var d = JSON.parse(clean.substring(start, end + 1));
    scoutCache[rank] = d;
    if (hasStorage()) window.storage.set('scout-' + rank, JSON.stringify(d)).catch(function(){});
    var b2 = document.getElementById('scout-box');
    if (b2 && currentModalRank === rank) b2.innerHTML = scoutHTML(d);
  }).catch(function(err){
    console.error('scout failed', err);
    var b2 = document.getElementById('scout-box');
    if (b2 && currentModalRank === rank) {
      b2.innerHTML = '<div class="scout-err">Couldn\u0027t load the scout report. Check your connection and try again.</div>' +
        '<button class="scout-btn" onclick="fetchScout(' + rank + ')">Retry</button>';
    }
  });
}

function teamOnClock(overall){
  var round = Math.ceil(overall / NUM_TEAMS);
  var idx = (overall - 1) % NUM_TEAMS;
  if (typeof DRAFT_TYPE !== 'undefined' && DRAFT_TYPE === 'linear') return idx + 1;
  return round % 2 === 1 ? idx + 1 : NUM_TEAMS - idx;
}
function pickLabel(overall){
  var round = Math.ceil(overall / NUM_TEAMS);
  var inRound = ((overall - 1) % NUM_TEAMS) + 1;
  return round + '.' + (inRound < 10 ? '0' : '') + inRound;
}
function myNextPick(after){
  for (var p = after; p <= TOTAL_PICKS; p++) if (teamOnClock(p) === MY_SLOT) return p;
  return null;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function available(){
  var taken = {};
  picks.forEach(function(r){ taken[r] = 1; });
  return PLAYERS.filter(function(p){ return !taken[p.rank]; });
}
function myPlayers(){
  var out = [];
  for (var i = 0; i < picks.length; i++)
    if (teamOnClock(i + 1) === MY_SLOT) out.push(BY_RANK[picks[i]]);
  return out;
}
function needCounts(mine){
  var c = { QB:0, RB:0, WR:0, TE:0, K:0, DST:0 };
  mine.forEach(function(p){ c[p.pos]++; });
  return c;
}
function ageClass(p){
  if (p.pos === 'DST') return '';
  if (p.pos === 'RB') return p.age <= 24 ? 'age-young' : (p.age >= 28 ? 'age-old' : 'age-mid');
  if (p.pos === 'QB') return p.age <= 26 ? 'age-young' : (p.age >= 34 ? 'age-old' : 'age-mid');
  return p.age <= 24 ? 'age-young' : (p.age >= 30 ? 'age-old' : 'age-mid'); /* WR/TE/K */
}
function ageChip(p){
  if (p.pos === 'DST' || !p.age) return '';
  var cls = ageClass(p);
  return '<span class="age-chip ' + cls + '">' + p.age + (p.rookie ? ' R' : '') + '</span>';
}

function slotRoster(mine){
  var slots = [];
  function add(label,pos){ slots.push({label:label,pos:pos,player:null}); }
  if (typeof SLOT_PLAN !== 'undefined' && SLOT_PLAN) {
    SLOT_PLAN.forEach(function(x){ add(x.label, x.pos); });
  } else {
  add('QB','QB'); add('RB','RB'); add('RB','RB');
  add('WR','WR'); add('WR','WR'); add('WR','WR');
  add('TE','TE'); add('W/R/T','FLEX'); add('W/R/T','FLEX');
  add('K','K'); add('DEF','DST');
  for (var i = 0; i < 15; i++) add('BN','BN');
  for (var j = 0; j < 3; j++) add('IR','IR');
  }
  mine.forEach(function(pl){
    var s = null;
    for (var j = 0; j < slots.length; j++)
      if (slots[j].pos === pl.pos && !slots[j].player) { s = slots[j]; break; }
    if (!s && (pl.pos==='RB'||pl.pos==='WR'||pl.pos==='TE'))
      for (var k = 0; k < slots.length; k++)
        if (slots[k].pos === 'FLEX' && !slots[k].player) { s = slots[k]; break; }
    if (!s && (pl.pos==='WR'||pl.pos==='TE'))
      for (var k2 = 0; k2 < slots.length; k2++)
        if (slots[k2].pos === 'RECFLEX' && !slots[k2].player) { s = slots[k2]; break; }
    if (!s && (pl.pos==='QB'||pl.pos==='RB'||pl.pos==='WR'||pl.pos==='TE'))
      for (var k3 = 0; k3 < slots.length; k3++)
        if (slots[k3].pos === 'SUPERFLEX' && !slots[k3].player) { s = slots[k3]; break; }
    if (!s)
      for (var m = 0; m < slots.length; m++)
        if (slots[m].pos === 'BN' && !slots[m].player) { s = slots[m]; break; }
    if (s) s.player = pl;
  });
  return slots;
}

function suggest(n){
  n = n || 10;
  var avail = available();
  var mine = myPlayers();
  var counts = needCounts(mine);
  var currentOverall = picks.length + 1;
  var round = Math.ceil(currentOverall / NUM_TEAMS);
  var nextAfter = myNextPick(currentOverall + 1);
  var gap = nextAfter ? nextAfter - currentOverall : 999;
  var flexUsed = Math.max(0, counts.RB - STARTERS.RB) + Math.max(0, counts.WR - STARTERS.WR) + Math.max(0, counts.TE - STARTERS.TE);
  var flexOpen = Math.max(0, STARTERS.FLEX - flexUsed);
  var myLeft = remainingPicksFor(MY_SLOT, currentOverall);
  var mustFill = mandatoryLeft(counts);
  var forced = myLeft <= mustFill;
  var mkt = marketState();

  var pool = avail.filter(function(p){
    if (counts[p.pos] >= POS_CAP[p.pos]) return false;
    if (forced) {
      if (p.pos === 'K') return counts.K === 0;
      if (p.pos === 'DST') return counts.DST === 0;
      if (p.pos === 'QB') return counts.QB === 0;
      if (p.pos === 'TE') return counts.TE === 0;
      return false;
    }
    return true;
  });
  if (!pool.length) pool = avail;

  /* same as the AI: K/DST rank last, so surface the best eligible one explicitly */
  var cand = pool.slice(0, 80);
  ['K','DST'].forEach(function(pos){
    if (counts[pos] > 0) return;
    if (round < 26 && !forced) return;
    for (var i = 0; i < pool.length; i++) {
      if (pool[i].pos === pos) { if (cand.indexOf(pool[i]) < 0) cand.push(pool[i]); break; }
    }
  });
  var scored = cand.map(function(p, idxInPool){
    var score = 320 - p.rank;
    var reasons = [];
    if (forced) {
      score += 300;
      reasons.push('MUST FILL \u2014 only ' + myLeft + ' pick' + (myLeft===1?'':'s') + ' left and your ' + p.pos + ' slot is empty');
    }
    var open = 0;
    if (p.pos === 'QB') {
      open = STARTERS.QB - counts.QB;
      if (counts.QB === 0) { score += (round >= 2 ? 26 : 10); reasons.push('Need a QB \u2014 6pt pass TDs make a long-term QB valuable'); }
      else { score -= 60; reasons.push('QB2 \u2014 only worth it as a young stash'); if (p.age <= 25) score += 15; }
    } else if (p.pos === 'TE') {
      open = STARTERS.TE - counts.TE;
      if (counts.TE === 0) { score += 20; reasons.push('TE slot open \u2014 steepest positional cliff in the league'); }
      else if (flexOpen > 0 && counts.TE === 1) { score -= 10; }
      else { score -= 45; reasons.push('TE already filled'); }
    } else if (p.pos === 'RB' || p.pos === 'WR') {
      open = STARTERS[p.pos] - counts[p.pos];
      if (open > 0) { score += 15; reasons.push(p.pos + (counts[p.pos]+1) + ' starter slot open'); }
      else if (flexOpen > 0) { score += 8; reasons.push('Fills a W/R/T flex spot'); }
      else { score += 2; reasons.push('Depth / dynasty stash'); }
      if (round >= 8 && counts[p.pos] < POS_TARGET[p.pos]) {
        score += 10;
        reasons.push('Thin at ' + p.pos + ' \u2014 only ' + counts[p.pos] + ' rostered');
      }
      if (p.pos === 'WR') score += 1; /* mild full-PPR lean; heavier weighting crowded out RB value in testing */
    } else {
      if (counts[p.pos] > 0) { score -= 300; }
      else if (round >= 26) { score += 40; reasons.push('Time to grab your ' + (p.pos==='K'?'kicker':'defense')); }
      else { score -= 250; reasons.push('Never early on K/DEF in dynasty \u2014 stash young players instead'); }
    }

    /* ---- MARKET AWARENESS: what the rest of the league has done ---- */
    var st = mkt[p.pos];
    if (st) {
      var needsIt = open > 0 || (flexOpen > 0 && (p.pos === 'RB' || p.pos === 'WR' || p.pos === 'TE'));
      if (needsIt) {
        if (st.supply === 0) {
          /* barren: chasing the need here means badly overpaying */
          score += 4;
          reasons.push(p.pos + ' cupboard is bare \u2014 best left is well below market value');
        } else if (st.pressure >= 1) {
          score += 20;
          reasons.push('SCARCE \u2014 only ' + st.tierLeft + ' Tier ' + st.topTier + ' ' + p.pos + (st.tierLeft===1?'':'s') + ' left, likely gone in the next ' + st.gap + ' picks');
        } else if (st.pressure >= 0.6) {
          score += 12;
          reasons.push('TIGHT at ' + p.pos + ' \u2014 ' + st.tierLeft + ' left in this tier before the quality drops');
        } else if (st.pressure <= 0.3) {
          score -= 6;
          reasons.push(p.pos + ' is deep (' + st.tierLeft + ' left in tier) \u2014 safe to wait a round');
        }
        /* am I behind the league at this position? */
        if (counts[p.pos] + 1.5 <= st.leagueAvg) {
          score += 10;
          reasons.push('You\u0027re behind at ' + p.pos + ' (you ' + counts[p.pos] + ', league avg ' + st.leagueAvg.toFixed(1) + ')');
        }
      }
      /* positional run in progress */
      if (st.run >= 6 && st.recentTotal >= 8) {
        score += needsIt ? 8 : 2;
        reasons.push(p.pos + ' RUN \u2014 ' + st.run + ' of the last ' + st.recentTotal + ' picks were ' + p.pos + 's');
      }
    }

    if (p.pos === 'RB' && p.age >= 28) { reasons.push('Age ' + p.age + ' RB \u2014 win-now piece, little resale value'); score -= 4; }
    else if ((p.pos === 'WR' || p.pos === 'TE') && p.age >= 30) { reasons.push('Age ' + p.age + ' \u2014 declining dynasty asset'); score -= 4; }
    else if (p.rookie) { reasons.push('2026 rookie \u2014 max long-term upside'); score += 3; }
    else if (p.age <= 23 && p.pos !== 'DST') { reasons.push('Only ' + p.age + ' \u2014 ascending asset'); score += 2; }

    if (idxInPool < gap && gap < 30) { reasons.push('Likely gone before your next pick (' + gap + ' away)'); score += 6; }
    /* real projections inform but never override dynasty rank in a dynasty league */
    if (PROJ[p.rank]) {
      var eg = projEdge(p);
      if (eg && eg.delta >= 8) {
        score += 4;
        reasons.push('Projects ' + PROJ[p.rank].ppg.toFixed(1) + ' PPG \u2014 produces like ' + p.pos + eg.prodRank + ', better than his dynasty price');
      } else if (eg && eg.delta <= -8) {
        reasons.push('Projects only ' + PROJ[p.rank].ppg.toFixed(1) + ' PPG in 2026 \u2014 you\u0027re buying future seasons');
      }
    }
    var sameTier = avail.filter(function(a){ return a.pos === p.pos && a.tier === p.tier; });
    if (sameTier.length <= 2 && sameTier.length > 0 && p.pos !== 'K' && p.pos !== 'DST') {
      reasons.push('Tier ' + p.tier + ' ' + p.pos + ' cliff \u2014 only ' + sameTier.length + ' left');
      score += 5;
    }
    return { p: p, score: score, reasons: reasons };
  });
  scored.sort(function(a,b){ return b.score - a.score; });
  return scored.slice(0, n);
}

      try { var parsed = JSON.parse(r.value); if (Array.isArray(parsed)) picks = parsed; } catch(e){}
    }

  }).catch(function(){ render(); });
}

  }

}

function viewGrade(){

  html += '<div class="summary-row"><span>Avg skill-player age</span><b>' + (g.avgAge ? g.avgAge.toFixed(1) : '\u2014') + '</b></div>';
  html += '<div class="summary-row"><span>Top-24 dynasty assets</span><b>' + g.elites + '</b></div>';
  html += '<div class="summary-row"><span>Roster</span><b>' + g.counts.QB + 'QB / ' + g.counts.RB + 'RB / ' + g.counts.WR + 'WR / ' + g.counts.TE + 'TE</b></div>';
  html += '<div class="summary-row"><span>Empty starting slots</span><b style="color:' + (g.emptyStarters ? '#f4778a' : '#6ee7b4') + '">' + g.emptyStarters + '</b></div>';
  html += '</div>';

  html += '<div class="section-label">Overall takeaways</div><div class="grade-card">';
  g.notes.forEach(function(n){ html += '<div class="grade-tip" style="padding:5px 0;">\u2022 ' + esc(n) + '</div>'; });
  html += '</div>';

  html += '<div class="section-label">Round by round</div>';
  g.rounds.forEach(function(r){
    html += '<div class="grade-card">' +
      '<div class="grade-round">Round ' + r.round + ' &middot; Pick ' + r.label + '</div>' +
      '<div class="grade-verdict ' + r.cls + '">' + r.verdict + (r.cost > 2 ? ' \u2014 ' + r.cost + ' spots given up' : '') + '</div>' +
      '<div class="grade-pick">' + esc(r.player.name) + ' ' + ageChip(r.player) +
      ' <span class="team-tag">' + r.player.pos + ' &middot; ' + r.player.team + ' &middot; #' + r.player.rank + '</span></div>' +
      '<div class="grade-tip">' + esc(r.tip) + '</div>';
    if (r.alts.length) {
      html += '<div class="grade-alt">Also on the board: ' +
        r.alts.map(function(a){ return esc(a.name) + ' (' + a.pos + ' #' + a.rank + ')'; }).join(' &middot; ') + '</div>';
    }
    html += '</div>';
  });

  html += '<div style="display:flex;gap:8px;margin:16px 0 8px;">' +
    '<button class="mock-start-btn" style="margin:0;" onclick="restartMock()">Run another mock</button>' +
    '<button class="close-btn" style="flex:0 0 auto;" onclick="exitMock()">Exit</button></div>';
  return html;
}

function centerContent(){
  if (tab === 'grade') return viewGrade();
  if (tab === 'team')  return viewTeam();
  if (tab === 'board') return viewBoard();
  return isWide() ? panelFeed() : viewDraft();
}

function renderView(){
  var v = document.getElementById('view');
  var L = document.getElementById('col-left');
  var R = document.getElementById('col-right');
  var head = document.getElementById('center-head');
  var wide = isWide();
  document.body.className = wide ? 'wide' : 'narrow';

  if (wide) {
    if (L) L.innerHTML = panelMyCounts() + panelMarket() + panelSuggest();
    if (R) R.innerHTML = panelList();
    v.innerHTML = panelControls() + centerContent();
  } else {
    if (L) L.innerHTML = '';
    if (R) R.innerHTML = '';
    v.innerHTML = (tab === 'draft') ? viewDraft() : (panelControls() + centerContent());
  }
  if (head) head.textContent = tab === 'team' ? 'My team'
    : tab === 'board' ? 'Full board' : tab === 'grade' ? 'Draft grade' : 'Live picks';
  var si = document.getElementById('search-input');
  if (si) si.value = search;
}

/* keep the layout honest when the window changes size */
var _resizeT = null;
function onResizeLayout(){
  if (_resizeT) clearTimeout(_resizeT);
  _resizeT = setTimeout(function(){ render(); }, 150);
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('resize', onResizeLayout);
}

function isWide(){ return (window.innerWidth || 0) >= 1000; }

/* ---- panel: draft controls (Sleeper / mock) ---- */
function panelControls(){
  if (mockMode) {
    return '<div class="mock-banner"><div class="mock-banner-txt">Mock draft in progress. The other 11 teams pick automatically \u2014 your real draft is saved.</div>' +
      '<button class="mock-exit" onclick="exitMock()">Exit</button></div>';
  }
  return '<div class="sl-row">' +
    '<button class="sl-connect' + (SLEEPER.on ? ' live' : '') + '" onclick="openSleeper()">' +
      (SLEEPER.on ? 'Sleeper live \u00b7 ' + SLEEPER.applied + ' picks' : 'Connect Sleeper') + '</button>' +
    '<button class="mock-start-btn sl-half" onclick="startMock()">Mock draft</button>' +
    '</div>';
}

/* ---- panel: what you already have ---- */
function panelMyCounts(){
  var mine = myPlayers();
  var counts = needCounts(mine);
  var slots = slotRoster(mine);
  var starters = slots.slice(0, STARTER_COUNT);
  var html = '<div class="mine-head">Your roster <span class="mine-total">' + mine.length + ' picked</span></div>';
  html += '<div class="mine-strip">';
  ['QB','RB','WR','TE','K','DST'].forEach(function(pos){
    var have = counts[pos] || 0;
    /* how many dedicated starting slots at this position are still empty */
    var openHere = starters.filter(function(x){ return x.pos === pos && !x.player; }).length;
    var state, cls;
    if (openHere > 0) { state = 'need ' + openHere; cls = 'need'; }
    else if (have === 0) { state = '\u2014'; cls = 'none'; }
    else { state = 'set'; cls = 'set'; }
    html += '<div class="mine-cell">' +
      '<div class="mine-pos" style="color:' + POS_COLOR[pos] + '">' + (pos === 'DST' ? 'DEF' : pos) + '</div>' +
      '<div class="mine-num">' + have + '</div>' +
      '<div class="mine-state ' + cls + '">' + state + '</div>' +
      '<span class="sr-only">' + (pos === 'DST' ? 'Defense' : pos) + ': ' + have + ' rostered' +
        (openHere > 0 ? ', ' + openHere + ' starting slot' + (openHere===1?'':'s') + ' still open' : ', starters filled') +
      '</span></div>';
  });
  html += '</div>';
  var openStarters = starters.filter(function(x){ return !x.player; }).length;
  var flexOpen = starters.filter(function(x){ return !x.player &&
    (x.pos === 'FLEX' || x.pos === 'SUPERFLEX' || x.pos === 'RECFLEX'); }).length;
  if (openStarters > 0) {
    html += '<div class="mine-foot">' + openStarters + ' starting slot' + (openStarters===1?'':'s') + ' still empty' +
      (flexOpen ? ', including ' + flexOpen + ' flex' : '') + '.</div>';
  } else if (mine.length) {
    html += '<div class="mine-foot">Every starting slot is filled \u2014 draft for depth and upside now.</div>';
  }
  return html;
}

/* ---- panel: market depth + scarcity alerts ---- */
function panelMarket(){
  if (picks.length >= TOTAL_PICKS) return '';
  var mkt = marketState();
  var myCounts = needCounts(myPlayers());
  var html = '<div class="market-strip">';
  ['QB','RB','WR','TE'].forEach(function(pos){
    var st = mkt[pos];
    var status, col;
    if (st.tierLeft === 0) { status = 'GONE'; col = '#FF6E7E'; }
    else if (st.supply === 0) { status = 'BARE'; col = '#FF6E7E'; }
    else if (st.pressure >= 1) { status = 'SCARCE'; col = '#FF6E7E'; }
    else if (st.pressure >= 0.6) { status = 'TIGHT'; col = '#F0A93C'; }
    else if (st.pressure >= 0.3) { status = 'OK'; col = '#55C8F5'; }
    else { status = 'DEEP'; col = '#46D39A'; }
    var fill = Math.max(6, Math.min(100, Math.round((st.tierLeft / 8) * 100)));
    html += '<div class="market-cell">' +
      '<div class="market-pos" style="color:' + POS_COLOR[pos] + '">' + pos + '</div>' +
      '<div class="market-num" style="color:' + col + '">' + st.tierLeft + '</div>' +
      '<div class="market-lbl" style="color:' + col + '">' + status + '</div>' +
      '<div class="depth"><i style="width:' + fill + '%;background:' + col + '"></i></div>' +
      '<span class="sr-only">' + pos + ': ' + st.tierLeft + ' left in the current tier, ' + status + '</span>' +
      '</div>';
  });
  html += '</div>';
  html += '<div class="market-caption">Players left in the top tier still on the board. ' +
    '<b style="color:#FF6E7E">Scarce</b> means that tier runs out before your next pick; ' +
    '<b style="color:#46D39A">Deep</b> means you can wait.</div>';
  var alerts = [];
  ['RB','WR','TE','QB'].forEach(function(pos){
    var st = mkt[pos];
    var short = STARTERS[pos] - myCounts[pos];
    if (short > 0 && st.supply === 0 && st.bestName) {
      alerts.push(pos + ' cupboard is bare \u2014 best left is ' + st.bestName + ' (#' + st.bestRank + '), only the ' + (st.bestIdx + 1) + 'th-best player on the board. Take value elsewhere and circle back.');
    } else if (short > 0 && st.pressure >= 0.6) {
      alerts.push('You still need ' + short + ' ' + pos + (short===1?'':'s') + ' and only ' + st.tierLeft + ' Tier ' + st.topTier + ' ' + pos + (st.tierLeft===1?' remains':'s remain') + ' \u2014 likely gone in the ' + st.gap + ' picks before your next turn.');
    } else if (st.run >= 6 && st.recentTotal >= 8 && short > 0) {
      alerts.push(pos + ' run in progress \u2014 ' + st.run + ' of the last ' + st.recentTotal + ' picks. Get ahead of it.');
    } else if (short > 0 && myCounts[pos] + 1.5 <= st.leagueAvg) {
      alerts.push('You\u0027re behind the league at ' + pos + ' (you ' + myCounts[pos] + ', league average ' + st.leagueAvg.toFixed(1) + ').');
    }
  });
  alerts.slice(0, 2).forEach(function(a){ html += '<div class="market-note">' + esc(a) + '</div>'; });
  return html;
}

/* ---- panel: the ten best picks right now ---- */
function panelSuggest(){
  if (picks.length >= TOTAL_PICKS) return '<div class="empty">Draft complete.</div>';
  var onClock = teamOnClock(picks.length + 1);
  var isMine = onClock === MY_SLOT;
  var sugg = suggest(10);
  var html = '<div class="suggest-card"><div class="suggest-head">' +
    (isMine ? 'Best picks for you' : 'Best available') + '</div>';
  sugg.forEach(function(s, i){
    var p = s.p;
    html += '<button type="button" class="suggest-row" onclick="openPlayer(' + p.rank + ')" ' +
      'aria-label="' + esc(p.name) + ', ' + p.pos + ' ' + p.team + ', dynasty rank ' + p.rank + '. Open player card.">' +
      '<div class="sug-num">' + (i + 1) + '</div>' + badge(p.pos) +
      '<div class="flex1"><div class="suggest-name">' +
      (i === 0 && isMine ? '<span class="star">\u2605</span> ' : '') +
      esc(p.name) + ' ' + ageChip(p) + ' <span class="team-tag">' + p.team + ' &middot; #' + p.rank + '</span></div>' +
      (s.reasons.length ? '<div class="reason">' + esc(s.reasons.slice(0,2).join(' \u00b7 ')) + '</div>' : '') +
      '</div><span class="hint" aria-hidden="true">INFO</span></button>';
  });
  html += '</div>';
  return html;
}

/* ---- panel: searchable full board ---- */
function panelList(){
  var done = picks.length >= TOTAL_PICKS;
  var onClock = done ? null : teamOnClock(picks.length + 1);
  var html = '<input id="search-input" class="search" placeholder="Search player or team\u2026" oninput="onSearch(this)" aria-label="Search players">';
  html += '<div class="chip-row">';
  ['ALL','QB','RB','WR','TE','K','DST'].forEach(function(pos){
    html += '<button type="button" class="chip" aria-pressed="' + (posFilter === pos) + '" ' +
      'onclick="setPos(\'' + pos + '\')">' + (pos === 'ALL' ? 'All' : pos) + '</button>';
  });
  html += '</div>';
  var q = search.trim().toLowerCase();
  var all = available().filter(function(p){
    if (posFilter !== 'ALL' && p.pos !== posFilter) return false;
    if (q && p.name.toLowerCase().indexOf(q) < 0 && p.team.toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var list = all.slice(0, isWide() ? 200 : 40);
  if (!list.length) {
    html += '<div class="empty">No players match. Clear the search or filter.</div>';
  } else {
    list.forEach(function(p){
      var pr = PROJ[p.rank];
      var eg = pr ? projEdge(p) : null;
      html += '<button type="button" class="player-row" onclick="openPlayer(' + p.rank + ')" ' +
        'aria-label="' + esc(p.name) + ', ' + p.pos + ' ' + p.team + ', rank ' + p.rank + '. Open player card.">' +
        '<div class="rank-num">' + p.rank + '</div>' + badge(p.pos) +
        '<div class="flex1"><div class="p-name">' + esc(p.name) + ' ' + ageChip(p) +
          (pr ? ' <span class="ppg-chip">' + pr.ppg.toFixed(1) + '</span>' : '') + '</div>' +
        '<div class="team-tag">' + p.team + ' &middot; Tier ' + p.tier + (p.rookie ? ' &middot; Rookie' : '') +
          (eg && Math.abs(eg.delta) >= 6 ? ' &middot; <span class="' + (eg.delta>0?'edge-up':'edge-dn') + '">' +
            (eg.delta>0 ? 'produces like ' + p.pos + eg.prodRank : 'ranked above 2026 output') + '</span>' : '') +
        '</div></div>' +
        '<span class="hint" aria-hidden="true">' + (done ? '' : '\u2192 T' + onClock) + '</span></button>';
    });
    if (all.length > list.length) {
      html += '<div class="empty">' + (all.length - list.length) + ' more \u2014 refine your search to see them.</div>';
    }
  }
  return html;
}

/* ---- panel: live pick feed (centre column on the Draft tab) ---- */
function panelFeed(){
  if (!picks.length) {
    return '<div class="empty">No picks logged yet.<br>Connect Sleeper to sync automatically, or tap a player to record a pick.</div>';
  }
  var html = '<div class="section-label">Latest picks</div>';
  var startAt = Math.max(0, picks.length - 25);
  for (var i = picks.length - 1; i >= startAt; i--) {
    var p = BY_RANK[picks[i]];
    var t = teamOnClock(i + 1);
    var mine = t === MY_SLOT;
    html += '<div class="feed-row' + (mine ? ' mine' : '') + '">' +
      '<span class="board-pick">' + pickLabel(i + 1) + '</span>' + badge(p.pos) +
      '<span class="flex1 feed-name">' + esc(p.name) + '</span>' +
      '<span class="team-tag"' + (mine ? ' style="color:#8CEFC0"' : '') + '>' + (mine ? 'YOU' : 'T' + t) + '</span>' +
      '</div>';
  }
  return html;
}

function viewDraft(){
  return panelControls() + panelMyCounts() + panelMarket() + panelSuggest() + panelList();
}

function viewTeam(){
  var mine = myPlayers();
  var slots = slotRoster(mine);
  var html = '';
  var skill = mine.filter(function(p){ return p.pos !== 'K' && p.pos !== 'DST'; });
  if (skill.length) {
    var avg = skill.reduce(function(a,p){ return a + p.age; }, 0) / skill.length;
    html += '<div class="avg-age">Avg skill-player age: <b style="color:' + (avg <= 25 ? '#6ee7b4' : avg >= 28 ? '#f4778a' : '#e6ebfa') + '">' + avg.toFixed(1) + '</b>' +
      (avg <= 25 ? ' \u2014 young core, built to last' : avg >= 28 ? ' \u2014 win-now build, plan for turnover' : ' \u2014 balanced build') + '</div>';
  }
  html += '<div class="section-label">Starters</div>';
  if (projStatus === 'ready') {
    var lineupPPG = 0, covered = 0;
    slots.slice(0, STARTER_COUNT).forEach(function(s){
      if (s.player && PROJ[s.player.rank]) { lineupPPG += PROJ[s.player.rank].ppg; covered++; }
    });
    if (covered) {
      html += '<div class="avg-age">Projected starting lineup: <b style="color:#7fd4c1">' + lineupPPG.toFixed(1) + ' pts/week</b>' +
        (covered < 11 ? ' <span style="color:#43507c">(' + covered + ' of 11 slots projected)</span>' : '') + '</div>';
    }
  }
  slots.filter(function(s){ return s.pos!=='BN' && s.pos!=='IR'; }).forEach(function(s){ html += rosterRow(s); });
  var bn = slots.filter(function(s){ return s.pos==='BN'; });
  var ir = slots.filter(function(s){ return s.pos==='IR'; });
  if (bn.length) { html += '<div class="section-label">Bench (' + bn.length + ')</div>';
    bn.forEach(function(s){ html += rosterRow(s); }); }
  if (ir.length) { html += '<div class="section-label">Injured Reserve (' + ir.length + ')</div>';
    ir.forEach(function(s){ html += rosterRow(s); }); }
  html += '<div style="margin-top:20px;text-align:center;">';
  if (confirmingReset) {
    html += '<div style="color:#f4778a;margin-bottom:8px;font-size:14px;">Clear the entire draft? This can\'t be undone.</div>' +
      '<button class="danger-btn" onclick="doReset()">Yes, reset draft</button>' +
      '<button class="ghost-btn" onclick="cancelReset()">Cancel</button>';
  } else {
    html += '<button class="ghost-btn" onclick="askReset()">Reset draft</button>';
  }
  html += '</div>';
  return html;
}

function rosterRow(s){
  if (!s.player) {
    return '<div class="roster-row empty-slot">' + badge(s.pos, s.label) +
      '<div class="flex1 slot-empty">Empty</div></div>';
  }
  /* badge always carries the player's own position, in that position's colour */
  var mark = badge(s.player.pos);
  /* slots whose label isn't just the position keep a quiet tag so you still see the shape */
  var slotTag = (s.label !== s.player.pos)
    ? '<span class="slot-tag">' + esc(s.label) + '</span>' : '';
  return '<div class="roster-row">' + mark +
    '<div class="flex1"><div class="roster-name">' + esc(s.player.name) + ' ' + ageChip(s.player) + '</div>' +
    '<div class="team-tag">' + s.player.team + ' &middot; #' + s.player.rank + '</div></div>' +
    slotTag + '</div>';
}

function viewBoard(){
  if (!picks.length) return '<div class="empty">No picks yet. Log picks from the Draft tab as each team selects.</div>';
  var html = '';
  var rounds = Math.ceil(picks.length / NUM_TEAMS);
  for (var r = 0; r < rounds; r++) {
    html += '<div class="section-label">Round ' + (r + 1) + '</div>';
    var start = r * NUM_TEAMS;
    var end = Math.min(picks.length, start + NUM_TEAMS);
    for (var i = start; i < end; i++) {
      var overall = i + 1;
      var t = teamOnClock(overall);
      var p = BY_RANK[picks[i]];
      var mine = t === MY_SLOT;
      html += '<button type="button" class="board-row' + (mine ? ' mine' : '') + '" onclick="openPlayer(' + p.rank + ')" ' +
        'aria-label="Pick ' + pickLabel(overall) + ', ' + esc(p.name) + (mine ? ', your pick' : ', team ' + t) + '">' +
        '<div class="board-pick">' + pickLabel(overall) + '</div>' + badge(p.pos) +
        '<div class="flex1" style="font-weight:600;font-size:14px;">' + esc(p.name) + '</div>' +
        '<span class="team-tag"' + (mine ? ' style="color:#8CEFC0"' : '') + '>' + (mine ? 'YOU' : 'T' + t) + '</span></button>';
    }
  }
  return html;
}

function playerNotes(p){
  var notes = [];
  var avail = available();
  var isTaken = picks.indexOf(p.rank) >= 0;
  var mine = myPlayers();
  var counts = needCounts(mine);
  /* age / dynasty outlook */
  if (p.pos === 'DST') {
    notes.push('Defenses are year-to-year in dynasty \u2014 stream them, never invest.');
  } else if (p.pos === 'K') {
    notes.push('Kickers hold almost no dynasty value \u2014 grab one in the last two rounds.');
  } else {
    if (p.rookie) notes.push('2026 rookie \u2014 hasn\u0027t played an NFL snap, so this price is all projection. Max upside, max risk.');
    if (p.pos === 'RB') {
      if (p.age <= 23) notes.push('Age ' + p.age + ' RB \u2014 in the sweet spot; RBs typically peak years 2\u20135.');
      else if (p.age >= 30) notes.push('Age ' + p.age + ' RB \u2014 past the cliff. Only for a team pushing to win THIS year.');
      else if (p.age >= 27) notes.push('Age ' + p.age + ' RB \u2014 1\u20132 prime years left; value will fall every season you hold him.');
      else notes.push('Age ' + p.age + ' RB \u2014 in his prime window.');
    } else if (p.pos === 'WR') {
      if (p.age <= 23) notes.push('Age ' + p.age + ' WR \u2014 ascending; WRs often break out in years 2\u20133 and hold value into their late 20s.');
      else if (p.age >= 31) notes.push('Age ' + p.age + ' WR \u2014 decline phase; treat as a short-term contributor.');
      else if (p.age >= 28) notes.push('Age ' + p.age + ' WR \u2014 still productive, but resale value drops from here.');
      else notes.push('Age ' + p.age + ' WR \u2014 prime years; the safest asset class in dynasty.');
    } else if (p.pos === 'TE') {
      if (p.age <= 24) notes.push('Age ' + p.age + ' TE \u2014 TEs break out late; patience usually pays.');
      else if (p.age >= 31) notes.push('Age ' + p.age + ' TE \u2014 near the end of the productive curve.');
      else notes.push('Age ' + p.age + ' TE \u2014 prime window.');
    } else if (p.pos === 'QB') {
      if (p.age <= 26) notes.push('Age ' + p.age + ' QB \u2014 could be a 10-year starter. In a 6pt pass TD league that\u0027s a franchise cornerstone.');
      else if (p.age >= 34) notes.push('Age ' + p.age + ' QB \u2014 bridge option only; pair him with a young stash.');
      else notes.push('Age ' + p.age + ' QB \u2014 prime years, and QBs age gracefully.');
    }
  }
  /* tier scarcity */
  if (p.pos !== 'K' && p.pos !== 'DST') {
    var sameTier = avail.filter(function(a){ return a.pos === p.pos && a.tier === p.tier && a.rank !== p.rank; });
    if (!isTaken) {
      if (sameTier.length === 0) notes.push('LAST Tier ' + p.tier + ' ' + p.pos + ' on the board \u2014 the next ' + p.pos + ' is a clear step down.');
      else if (sameTier.length <= 2) notes.push('Tier ' + p.tier + ' ' + p.pos + ' is almost gone \u2014 only ' + sameTier.length + ' other' + (sameTier.length===1?'':'s') + ' left.');
      else notes.push(sameTier.length + ' other Tier ' + p.tier + ' ' + p.pos + 's still available if you wait.');
    }
  }
  /* will he make it back to you? */
  if (!isTaken) {
    var currentOverall = picks.length + 1;
    var nextAfter = myNextPick(currentOverall + 1);
    var gap = nextAfter ? nextAfter - currentOverall : 999;
    var idx = avail.findIndex(function(a){ return a.rank === p.rank; });
    if (gap < 30) {
      if (idx < gap) notes.push('Probably will NOT make it back to your next pick (' + gap + ' picks away).');
      else if (idx < gap + 8) notes.push('Coin flip to survive to your next pick (' + gap + ' picks away).');
      else notes.push('Good chance he\u0027s still there at your next pick (' + gap + ' picks away).');
    }
    /* roster fit */
    if (p.pos === 'QB' && counts.QB >= 1) notes.push('You already have a QB \u2014 this would be a stash/backup.');
    if (p.pos === 'TE' && counts.TE >= 1) notes.push('You already have a TE \u2014 this would be a flex/bench piece.');
  }
  return notes;
}

function openPlayer(rank){
  var p = BY_RANK[rank];
  if (!p) return;
  currentModalRank = rank;
  var isTaken = picks.indexOf(rank) >= 0;
  var done = picks.length >= TOTAL_PICKS;
  var onClock = done ? null : teamOnClock(picks.length + 1);
  var notes = playerNotes(p);
  var newsQ = encodeURIComponent(p.name + ' ' + (p.pos === 'DST' ? 'defense' : 'NFL') + ' news');
  var html = '<div style="display:flex;align-items:center;gap:10px;">' + badge(p.pos) +
    '<div class="flex1"><div class="modal-name">' + esc(p.name) + '</div>' +
    '<div class="modal-sub">' + p.team + (p.rookie ? ' &middot; 2026 Rookie' : '') + (isTaken ? ' &middot; ALREADY DRAFTED' : '') + '</div></div>' +
    ageChip(p) + '</div>' +
    '<div class="stat-grid">' +

    '<div class="stat-box"><div class="stat-val">' + p.pos + (p.pos==='DST'?'':p.posRank) + '</div><div class="stat-lbl">Pos rank</div></div>' +
    (PROJ[p.rank]
      ? '<div class="stat-box"><div class="stat-val" style="color:#7fd4c1">' + PROJ[p.rank].ppg.toFixed(1) + '</div><div class="stat-lbl">Proj PPG</div></div>'

  if (PROJ[p.rank]) {

    if (eg.delta >= 6) line += ' That is well ahead of his dynasty rank (' + p.pos + eg.dynPosRank + ') \u2014 a win-now bargain, but the market is discounting him for a reason, usually age.';
    else if (eg.delta <= -6) line += ' His dynasty rank (' + p.pos + eg.dynPosRank + ') sits well above that \u2014 you are paying for future seasons, not 2026.';
    else line += ' Roughly in line with his dynasty rank.';
    html += '<div class="note-row">' + esc(line) + '</div>';
  }
  notes.forEach(function(n){ html += '<div class="note-row">' + esc(n) + '</div>'; });
  var slug = p.name.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,'-');

      '<button class="lookup-btn" onclick="openResearch(\'https://www.fantasypros.com/nfl/players/' + slug + '.php\', \'' + esc(p.name) + '\')">Open FantasyPros profile</button>' +
    '</div>';
  html += '<div class="modal-actions">' +

  openWindow('win-player', p.name + '  \u00b7  ' + p.pos + ' \u00b7 ' + p.team, html, 'player');
  /* pull cached scout report from storage if we don't have it in memory */

          if (box) box.innerHTML = scoutHTML(d);

    }).catch(function(){});
  }
}
