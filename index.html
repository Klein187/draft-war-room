/* ==================== FLOATING WINDOW SYSTEM ==================== */
var WIN_Z = 200;
var DRAG = null;

function winDefaults(kind){
  var vw = window.innerWidth || 400, vh = window.innerHeight || 700;
  var mobile = vw < 640;
  if (kind === 'research') {
    return mobile
      ? { x:6, y:64, w:vw-12, h:Math.max(300, vh-120) }
      : { x:Math.max(16, vw-660), y:80, w:620, h:Math.min(660, vh-120) };
  }
  return mobile
    ? { x:6, y:48, w:vw-12, h:Math.min(540, vh-90) }
    : { x:Math.max(16, (vw-480)/2 - 180), y:64, w:470, h:Math.min(620, vh-110) };
}

function focusWindow(id){
  var el = document.getElementById(id);
  if (el) el.style.zIndex = ++WIN_Z;
}

function closeWindow(id){
  var el = document.getElementById(id);
  if (el && el.parentNode) el.parentNode.removeChild(el);
  if (id === 'win-player') currentModalRank = null;
}

function openWindow(id, title, bodyHTML, kind){
  var host = document.getElementById('windows');
  if (!host) return;
  var el = document.getElementById(id);
  if (el) {
    var b = el.getElementsByClassName('win-body')[0];
    var t = el.getElementsByClassName('win-title')[0];
    if (b) b.innerHTML = bodyHTML;
    if (t) t.innerHTML = esc(title);
    focusWindow(id);
    return;
  }
  var d = winDefaults(kind);
  el = document.createElement('div');
  el.className = 'win';
  el.id = id;
  if (el.setAttribute) { el.setAttribute('role','dialog'); el.setAttribute('aria-label', title); }
  el.style.left = Math.round(d.x) + 'px';
  el.style.top = Math.round(d.y) + 'px';
  el.style.width = Math.round(d.w) + 'px';
  el.style.height = Math.round(d.h) + 'px';
  el.style.zIndex = ++WIN_Z;
  el.innerHTML =
    '<div class="win-bar" data-drag="' + id + '">' +
      '<div class="win-title">' + esc(title) + '</div>' +
      '<button class="win-x" data-close="' + id + '">\u2715</button>' +
    '</div>' +
    '<div class="win-body">' + bodyHTML + '</div>' +
    '<div class="win-grip" data-resize="' + id + '"></div>';
  host.appendChild(el);
}

function winTarget(node, attr){
  while (node && node !== document) {
    if (node.getAttribute && node.getAttribute(attr)) return node.getAttribute(attr);
    node = node.parentNode;
  }
  return null;
}

function initWindowDrag(){
  if (typeof document.addEventListener !== 'function') return;

  document.addEventListener('pointerdown', function(e){
    var closeId = winTarget(e.target, 'data-close');
    if (closeId) { closeWindow(closeId); e.preventDefault(); return; }

    var dragId = winTarget(e.target, 'data-drag');
    var sizeId = winTarget(e.target, 'data-resize');
    var id = dragId || sizeId;
    if (!id) {
      var anyId = winTarget(e.target, 'id');
      if (anyId && anyId.indexOf('win-') === 0) focusWindow(anyId);
      return;
    }
    var el = document.getElementById(id);
    if (!el) return;
    focusWindow(id);
    DRAG = {
      id: id, mode: dragId ? 'move' : 'resize',
      sx: e.clientX, sy: e.clientY,
      ox: parseInt(el.style.left, 10) || 0, oy: parseInt(el.style.top, 10) || 0,
      ow: parseInt(el.style.width, 10) || 400, oh: parseInt(el.style.height, 10) || 300
    };
    /* block iframe from swallowing the pointer mid-drag */
    var f = el.getElementsByClassName('win-frame')[0];
    if (f) f.style.pointerEvents = 'none';
    if (e.target.setPointerCapture && e.pointerId != null) {
      try { e.target.setPointerCapture(e.pointerId); } catch(err){}
    }
    e.preventDefault();
  });

  document.addEventListener('pointermove', function(e){
    if (!DRAG) return;
    var el = document.getElementById(DRAG.id);
    if (!el) { DRAG = null; return; }
    var dx = e.clientX - DRAG.sx, dy = e.clientY - DRAG.sy;
    var vw = window.innerWidth, vh = window.innerHeight;
    if (DRAG.mode === 'move') {
      var nx = Math.min(Math.max(DRAG.ox + dx, -40), vw - 80);
      var ny = Math.min(Math.max(DRAG.oy + dy, 0), vh - 44);
      el.style.left = Math.round(nx) + 'px';
      el.style.top = Math.round(ny) + 'px';
    } else {
      el.style.width  = Math.round(Math.min(Math.max(DRAG.ow + dx, 260), vw - 12)) + 'px';
      el.style.height = Math.round(Math.min(Math.max(DRAG.oh + dy, 160), vh - 12)) + 'px';
    }
    e.preventDefault();
  });

  function endDrag(){
    if (!DRAG) return;
    var el = document.getElementById(DRAG.id);
    if (el) {
      var f = el.getElementsByClassName('win-frame')[0];
      if (f) f.style.pointerEvents = '';
    }
    DRAG = null;
  }
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      var host = document.getElementById('windows');
      if (host && host.children && host.children.length) closeWindow(host.children[host.children.length-1].id);
    }
  });
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
}

/* ---- research window: tries to embed, falls back to a tab ---- */
function openResearch(url, title){
  var safe = esc(url);
  var body =
    '<div class="win-note">' +
      '<span>Google and many sports sites refuse to load inside another page. If it stays blank, that\u0027s why \u2014 use the button.</span>' +
      '<a class="win-open" href="' + safe + '" target="_blank" rel="noopener">Open in tab \u2197</a>' +
    '</div>' +
    '<div class="win-frame-wrap">' +
      '<iframe class="win-frame" src="' + safe + '" referrerpolicy="no-referrer" ' +
        'sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>' +
    '</div>';
  openWindow('win-research', title, body, 'research');
}


/* ==================== SLEEPER LIVE SYNC ==================== */
var SLEEPER = { on:false, username:'', userId:'', leagueId:'', leagueName:'', draftId:'',
                status:'', lastSync:null, timer:null, applied:0, unmatched:[], warn:'' };
var DRAFT_TYPE = 'snake';
var SLOT_PLAN = null;   /* built from the league's real roster settings */

function sleeperGet(path){
  return fetch('https://api.sleeper.app/v1' + path).then(function(r){
    if (!r.ok) throw new Error('Sleeper ' + r.status);
    return r.json();
  });
}

/* --- map a Sleeper pick to a board player, inventing an entry if unknown --- */
function sleeperMatch(pick){
  var md = pick.metadata || {};
  var pos = String(md.position || '').toUpperCase();
  if (pos === 'DEF') pos = 'DST';
  var name = ((md.first_name || '') + ' ' + (md.last_name || '')).trim();

  if (pos === 'DST') {
    var tm = String(md.team || '').toUpperCase();
    for (var i = 0; i < PLAYERS.length; i++)
      if (PLAYERS[i].pos === 'DST' && PLAYERS[i].team.toUpperCase() === tm) return PLAYERS[i].rank;
  }
  var r = matchPlayer(name, pos);
  if (r != null) return r;

  /* not on our board (deep sleeper, practice squad) — register it so pick order stays true */
  var rank = PLAYERS.length + 1;
  var p = { rank:rank, name:name || ('Unknown ' + pos), pos:(pos||'WR'), team:(md.team||'FA'),
            age:0, tier:99, rookie:false, posRank:0 };
  PLAYERS.push(p);
  BY_RANK[rank] = p;
  NAME_INDEX = null;
  SLEEPER.unmatched.push(p.name);
  return rank;
}

/* --- rebuild roster slots + league size from the real league --- */
function applyDraftConfig(draft, myUserId, reserveSlots){
  var st = draft.settings || {};
  if (st.teams)  NUM_TEAMS = st.teams;
  if (st.rounds) ROUNDS = st.rounds;
  TOTAL_PICKS = NUM_TEAMS * ROUNDS;
  DRAFT_TYPE = (draft.type === 'linear') ? 'linear' : 'snake';

  if (draft.draft_order && myUserId && draft.draft_order[myUserId]) {
    MY_SLOT = draft.draft_order[myUserId];
  }

  var plan = [];
  function push(n, label, pos){ for (var i=0;i<(n||0);i++) plan.push({label:label,pos:pos}); }
  push(st.slots_qb, 'QB','QB');
  push(st.slots_rb, 'RB','RB');
  push(st.slots_wr, 'WR','WR');
  push(st.slots_te, 'TE','TE');
  push(st.slots_flex, 'W/R/T','FLEX');
  push(st.slots_super_flex, 'SFLEX','SUPERFLEX');
  push(st.slots_rec_flex, 'W/T','RECFLEX');
  push(st.slots_k, 'K','K');
  push(st.slots_def, 'DEF','DST');
  var starterCount = plan.length;
  push(st.slots_bn, 'BN','BN');
  push(reserveSlots, 'IR','IR');
  if (plan.length) {
    SLOT_PLAN = plan;
    STARTERS = { QB:st.slots_qb||0, RB:st.slots_rb||0, WR:st.slots_wr||0, TE:st.slots_te||0,
                 FLEX:(st.slots_flex||0)+(st.slots_super_flex||0)+(st.slots_rec_flex||0),
                 K:st.slots_k||0, DST:st.slots_def||0 };
    STARTER_COUNT = starterCount;
  }
}

/* --- pull picks and mirror them onto the board --- */
function syncPicks(){
  if (!SLEEPER.draftId || mockMode) return;
  sleeperGet('/draft/' + SLEEPER.draftId + '/picks').then(function(rows){
    if (!Array.isArray(rows)) return;
    rows.sort(function(a,b){ return (a.pick_no||0) - (b.pick_no||0); });
    var next = [];
    var mismatch = 0;
    rows.forEach(function(pk, i){
      next.push(sleeperMatch(pk));
      if (pk.draft_slot && teamOnClock(i+1) !== pk.draft_slot) mismatch++;
    });
    SLEEPER.warn = mismatch > 0
      ? 'Pick order differs from Sleeper on ' + mismatch + ' pick(s) — check the draft type.'
      : '';
    var changed = next.length !== picks.length;
    picks = next;
    SLEEPER.applied = next.length;
    SLEEPER.lastSync = new Date();
    SLEEPER.status = 'live';
    saveDraft();
    render();
  }).catch(function(e){
    SLEEPER.status = 'error';
    SLEEPER.warn = 'Sync failed: ' + e.message;
    render();
  });
}

function startSync(){
  if (SLEEPER.timer) clearInterval(SLEEPER.timer);
  SLEEPER.on = true;
  syncPicks();
  SLEEPER.timer = setInterval(syncPicks, 5000);
  if (hasStorage()) window.storage.set('sleeper-cfg', JSON.stringify({
    username:SLEEPER.username, userId:SLEEPER.userId,
    leagueId:SLEEPER.leagueId, leagueName:SLEEPER.leagueName, draftId:SLEEPER.draftId
  })).catch(function(){});
}

function stopSync(){
  SLEEPER.on = false;
  SLEEPER.status = '';
  if (SLEEPER.timer) { clearInterval(SLEEPER.timer); SLEEPER.timer = null; }
  render();
}

/* --- connect flow: username -> leagues -> draft --- */
function sleeperFindUser(){
  var el = document.getElementById('sleeper-user');
  var name = el ? String(el.value || '').trim() : '';
  if (!name) return;
  SLEEPER.username = name;
  SLEEPER.status = 'looking up user\u2026';
  renderSleeperWindow();
  sleeperGet('/user/' + encodeURIComponent(name)).then(function(u){
    if (!u || !u.user_id) throw new Error('user not found');
    SLEEPER.userId = u.user_id;
    var yr = new Date().getFullYear();
    return sleeperGet('/user/' + u.user_id + '/leagues/nfl/' + yr).then(function(ls){
      if (!ls || !ls.length) return sleeperGet('/user/' + u.user_id + '/leagues/nfl/' + (yr-1));
      return ls;
    });
  }).then(function(leagues){
    SLEEPER.leagues = leagues || [];
    SLEEPER.status = SLEEPER.leagues.length ? 'pick a league' : 'no leagues found';
    renderSleeperWindow();
  }).catch(function(e){
    SLEEPER.status = 'Could not find that username (' + e.message + ')';
    renderSleeperWindow();
  });
}

function sleeperPickLeague(leagueId, leagueName){
  SLEEPER.leagueId = leagueId;
  SLEEPER.leagueName = leagueName;
  SLEEPER.status = 'loading draft\u2026';
  renderSleeperWindow();
  var reserve = 0;
  sleeperGet('/league/' + leagueId).then(function(lg){
    reserve = (lg && lg.settings && lg.settings.reserve_slots) || 0;
    return sleeperGet('/league/' + leagueId + '/drafts');
  }).then(function(drafts){
    if (!drafts || !drafts.length) throw new Error('no draft found for this league');
    drafts.sort(function(a,b){ return (b.created||0) - (a.created||0); });
    var d = drafts[0];
    SLEEPER.draftId = d.draft_id;
    applyDraftConfig(d, SLEEPER.userId, reserve);
    SLEEPER.status = 'connected';
    startSync();
    renderSleeperWindow();
  }).catch(function(e){
    SLEEPER.status = 'Error: ' + e.message;
    renderSleeperWindow();
  });
}

function openSleeper(){ renderSleeperWindow(); }

function renderSleeperWindow(){
  var h = '';
  if (SLEEPER.on) {
    h += '<div class="sl-live">Connected to <b>' + esc(SLEEPER.leagueName || 'league') + '</b></div>' +
         '<div class="sl-meta">' + SLEEPER.applied + ' picks synced &middot; ' +
         NUM_TEAMS + ' teams &middot; ' + ROUNDS + ' rounds &middot; you are slot ' + MY_SLOT +
         (SLEEPER.lastSync ? ' &middot; updated ' + SLEEPER.lastSync.toLocaleTimeString() : '') + '</div>';
    if (SLEEPER.warn) h += '<div class="sl-warn">' + esc(SLEEPER.warn) + '</div>';
    if (SLEEPER.unmatched.length) h += '<div class="sl-meta">Not on the board (added automatically): ' +
      esc(SLEEPER.unmatched.slice(-6).join(', ')) + '</div>';
    h += '<button class="sl-btn sl-stop" onclick="stopSync();renderSleeperWindow()">Disconnect</button>';
  } else if (SLEEPER.leagues && SLEEPER.leagues.length && !SLEEPER.leagueId) {
    h += '<div class="sl-meta">Choose the league to follow:</div>';
    SLEEPER.leagues.forEach(function(l){
      h += '<button class="sl-league" onclick="sleeperPickLeague(\'' + esc(l.league_id) + '\',\'' +
           esc(String(l.name||'').replace(/'/g,'')) + '\')">' + esc(l.name || l.league_id) +
           ' <span class="sl-sub">' + (l.total_rosters||'?') + ' teams &middot; ' + esc(l.season||'') + '</span></button>';
    });
  } else {
    h += '<div class="sl-meta">Enter your Sleeper username. No password needed \u2014 Sleeper\u0027s API is public and read-only.</div>' +
         '<input id="sleeper-user" class="search" placeholder="Sleeper username" value="' + esc(SLEEPER.username) + '">' +
         '<button class="sl-btn" onclick="sleeperFindUser()">Find my leagues</button>';
  }
  if (SLEEPER.status && !SLEEPER.on) h += '<div class="sl-meta">' + esc(SLEEPER.status) + '</div>';
  openWindow('win-sleeper', 'Sleeper sync', h, 'player');
}

function restoreSleeper(){
  if (!hasStorage()) return;
  window.storage.get('sleeper-cfg').then(function(r){
    if (!r || !r.value) return;
    try {
      var c = JSON.parse(r.value);
      if (c && c.draftId) {
        SLEEPER.username = c.username || '';
        SLEEPER.userId = c.userId || '';
        SLEEPER.leagueId = c.leagueId || '';
        SLEEPER.leagueName = c.leagueName || '';
        SLEEPER.draftId = c.draftId;
        SLEEPER.status = 'reconnecting\u2026';
        sleeperGet('/draft/' + c.draftId).then(function(d){
          applyDraftConfig(d, SLEEPER.userId, 0);
          startSync();
        }).catch(function(){ SLEEPER.status='' ; });
      }
    } catch(e){}
  }).catch(function(){});
}

function render(){
  renderChyron();
  renderView();
  ['draft','team','board','grade'].forEach(function(t){
    var el = document.getElementById('tab-' + t);
    if (el && el.setAttribute) el.setAttribute('aria-selected', tab === t ? 'true' : 'false');
  });
  document.getElementById('tab-draft').className = 'tab-btn' + (tab==='draft' ? ' active' : '');
  document.getElementById('tab-team').className = 'tab-btn' + (tab==='team' ? ' active' : '');
  document.getElementById('tab-team').textContent = 'My Team (' + myPlayers().length + ')';
  document.getElementById('tab-board').className = 'tab-btn' + (tab==='board' ? ' active' : '');
  var gt = document.getElementById('tab-grade');
  if (mockGrade) {
    gt.style.display = '';
    gt.className = 'tab-btn' + (tab==='grade' ? ' active' : '');
    gt.textContent = 'Grade ' + mockGrade.letter;
  } else {
    gt.style.display = 'none';
  }
  document.getElementById('undo-btn').disabled = picks.length === 0;
}

initWindowDrag();
loadDraft();
restoreSleeper();
